<template>

    /* ---------- ground ---------- */
    .f05-bg { position: absolute; inset: 0; background: #ffffff; }
    .f05-w  { position: absolute; inset: 0; }

    /* ---------- slide-header ---------- */
    .f05-eyebrow {
      position: absolute; left: 110px; top: 110px;

    .f05-stage {
      position: absolute; inset: 0;

      transform-style: preserve-3d;

    /* Both cells are IDENTICAL: same box, same tint, same border, same inner insets.

  </style>

  <div id="root" data-composition-id="05-not-all-diffs-equal"

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      /* =========================================================
         Scene 1 (0.0-2.0) — "not all diffs are equal"
         eyebrow + per-word headline reveal. Word starts are
         pre-computed ONCE from content length
         (dynamic-content-sequencing), never inside an onUpdate.
         ========================================================= */
      tl.fromTo(".f05-eyebrow",
        { opacity: 0, y: 14 },
        { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.12);

      var WORD_BASE = 0.10;      /* BASE_DURATION floor per word */
      var SEC_PER_CHAR = 0.018;  /* longer words earn more runway */
      var cursor = 0.35;
      gsap.utils.toArray(".f05-word").forEach(function (word) {
        tl.fromTo(word,
          { opacity: 0, y: 26 },
          { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" }, cursor);
        cursor += WORD_BASE + word.textContent.length * SEC_PER_CHAR;
      });

      /* =========================================================
         Scene 2 (2.0-4.8) — "Three hundred lines of UI breaks one page."
         split-tilt-cards: left cell arrives from the LEFT wing on a
         book-open +rotationY that swings all the way flat, so the two
         numerals end at identical rendered size (no foreshortening).
         ========================================================= */
      tl.fromTo("#f05-cell-left",
        { x: -420, rotationY: 18, opacity: 0 },
        { x: 0, rotationY: 0, opacity: 1, duration: 1.0, ease: "power3.out" }, 2.0);

      /* counting-dynamic-scale — value + transform scale, same position, same ease */
      var counter = document.getElementById("f05-count");
      var state = { value: 0 };
      var COUNT_AT = 2.45, COUNT_DUR = 1.5, COUNT_EASE = "power3.out";
      var START_SCALE = 0.55; /* 82.5px START / 150px END */

      tl.to(state, {
        value: 300, duration: COUNT_DUR, ease: COUNT_EASE,
        onUpdate: function () { counter.textContent = Math.round(state.value); }
      }, COUNT_AT);
      tl.fromTo(counter,
        { scale: START_SCALE, opacity: 0 },
        { scale: 1, opacity: 1, duration: COUNT_DUR, ease: COUNT_EASE }, COUNT_AT);

      tl.fromTo("#f05-lede-left",
        { opacity: 0, y: 18 },
        { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" }, 2.6);

      /* badge lands on "breaks one page" — spring-pop, smooth settle */
      tl.fromTo("#f05-badge-left",
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.55, ease: "power3.out" }, 4.15);

      /* =========================================================
         Scene 3 (4.8-7.6) — "Three lines of database code"
         mirrored right-wing entry; the 3 arrives at the SAME type size
         and the SAME start scale as the 300 — only the ink differs.
         ========================================================= */
      tl.fromTo("#f05-cell-right",
        { x: 420, rotationY: -18, opacity: 0 },
        { x: 0, rotationY: 0, opacity: 1, duration: 1.0, ease: "power3.out" }, 4.85);

      tl.fromTo("#f05-axis",
        { scaleY: 0, opacity: 0 },
        { scaleY: 1, opacity: 1, duration: 0.7, ease: "power3.out" }, 5.0);
      tl.fromTo("#f05-vs",
        { scale: 0.8, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.5, ease: "power3.out" }, 5.15);

      tl.fromTo("#f05-three",
        { scale: START_SCALE, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.8, ease: COUNT_EASE }, 5.45);

      tl.fromTo("#f05-lede-right",
        { opacity: 0, y: 18 },
        { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" }, 5.75);

      /* =========================================================
         Scene 4 (7.6-9.259) — "breaks the entire app."
         inner-edge badge spring-pop (smooth settle), then the marker
         circle scribes around the 3. Both cells hold motionless.
         ========================================================= */
      tl.fromTo("#f05-badge-right",
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.6, ease: "power3.out" }, 7.7);

      tl.fromTo("#f05-ring",
        { scale: 0, opacity: 0, rotation: -9 },
        { scale: 1, opacity: 1, rotation: -3, duration: 0.7, ease: "back.out(1.5)" }, 8.15);

      /* held stillness through the tail of the shot (no-op keeps the
         timeline's length matched to the frame duration) */
      tl.set("#f05-ring", { opacity: 1 }, 9.259);

      window.__timelines["05-not-all-diffs-equal"] = tl;
      tl.seek(0);
    })();
  </script>
