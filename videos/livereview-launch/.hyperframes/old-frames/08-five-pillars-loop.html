  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });
      window.__timelines["08-five-pillars-loop"] = tl;

      var $ = function (sel) { return document.querySelector(sel); };

      /* ---------- virtual camera (viewport-change, PAN mode: one .world, one writer) ---------- */
      var world = $("#f08-world");
      var cam = { x: 0, y: -10, scale: 1.05 };
      function applyCam() {
        world.style.transform = "translate(" + cam.x + "px, " + cam.y + "px) scale(" + cam.scale + ")";
      }
      applyCam(); // seed frame 0

      function panTo(x, y, at, dur, ease) {
        tl.to(cam, { x: x, y: y, duration: dur, ease: ease || "power2.inOut", onUpdate: applyCam }, at);
      }

      /* ---------- svg-path-draw setup: measured geometry, never guessed ---------- */
      var drawIds = ["#f08-guide", "#f08-e1", "#f08-e2", "#f08-e3", "#f08-e4", "#f08-e5", "#f08-ret"];
      var lens = {};
      drawIds.forEach(function (id) {
        var p = $(id);
        var len = p.getTotalLength() * 1.02;
        lens[id] = len;
        p.style.strokeDasharray = String(len);
        p.style.strokeDashoffset = String(len);
      });
      function draw(id, at, dur, ease) {
        tl.to(id, { strokeDashoffset: 0, duration: dur, ease: ease || "power2.out" }, at);
      }

      /* ---------- chrome + edge ornaments park hidden ---------- */
      gsap.set(["#f08-c1", "#f08-c2", "#f08-c3", "#f08-c4", "#f08-c5", "#f08-retc", "#f08-arrow"], {
        opacity: 0, scale: 0.55, transformOrigin: "0px 0px"
      });
      gsap.set("#f08-tag", { opacity: 0, scale: 0.86, transformOrigin: "50% 50%" });

      function popChev(id, at) {
        tl.to(id, { opacity: 1, scale: 1, duration: 0.3, ease: "power2.out" }, at);
      }

      /* =====================================================================
         SCENE 1 (0.0-2.2s) — "runs on five pillars"
         Empty field. Header states the frame; the faint ring guide self-draws.
         ===================================================================== */
      tl.fromTo("#f08-accent",
        { opacity: 0, scaleX: 0, transformOrigin: "0% 50%" },
        { opacity: 1, scaleX: 1, duration: 0.40, ease: "power3.out" }, 0.02);

      tl.fromTo("#f08-eyebrow",
        { opacity: 0, y: 14 },
        { opacity: 1, y: 0, duration: 0.42, ease: "power2.out" }, 0.08);

      tl.fromTo("#f08-h2a",
        { opacity: 0, y: 18 },
        { opacity: 1, y: 0, duration: 0.48, ease: "power3.out" }, 0.14);

      // "One loop." is withheld — it lands with the return edge in Scene 3.
      gsap.set("#f08-h2b", { opacity: 0, y: 12 });

      draw("#f08-guide", 0.35, 1.72, "none"); // constant-rate pen: a ring exists here

      /* =====================================================================
         SCENE 2 (2.2-7.4s) — the five nodes place ONE PER SPOKEN NAME.
         orbit-3d-entry (entry only): each flips IN PLACE at its fixed ring
         position; the camera pans to lean on each one as it lands.
         ===================================================================== */
      var NODES = ["#f08-n1", "#f08-n2", "#f08-n3", "#f08-n4", "#f08-n5"];
      var NODE_AT = [2.20, 3.24, 4.28, 5.32, 6.36];

      NODES.forEach(function (id, i) {
        // park at the ring position, hidden, BEFORE any tween fires
        gsap.set(id, {
          rotateX: -78, rotateY: 26, z: -280,
          scale: 0.55, opacity: 0,
          transformOrigin: "50% 50%"
        });
        // flip in IN PLACE — rotation / opacity / scale only, never translate
        tl.to(id, {
          rotateX: 0, rotateY: 0, z: 0,
          scale: 1, opacity: 1,
          duration: 0.55, ease: "back.out(1.5)"
        }, NODE_AT[i]);
      });

      // camera stations — pan-to-target, no push-in (the blueprint's camera modifier)
      panTo(0,    18,  1.80, 0.90); // lean on Review
      panTo(-150, -4,  2.90, 0.85); // Understand
      panTo(-105, -14, 3.95, 0.85); // Enforce
      panTo(105,  -14, 5.00, 0.85); // Improve
      panTo(150,  -8,  6.05, 0.85); // Connect

      // the five forward edges — each grows out of the node that just landed
      draw("#f08-e1", 3.40, 0.58);
      draw("#f08-e2", 4.44, 0.58);
      draw("#f08-e3", 5.48, 0.62);
      draw("#f08-e4", 6.52, 0.50);
      draw("#f08-e5", 6.94, 0.52);

      popChev("#f08-c1", 3.85);
      popChev("#f08-c2", 4.89);
      popChev("#f08-c3", 5.95);
      popChev("#f08-c4", 6.92);
      popChev("#f08-c5", 7.32);

      /* =====================================================================
         SCENE 3 (7.4-9.6s) — THE RETURN EDGE. The payoff of the frame.
         Improve -> Review draws across the ring and closes the circuit,
         then everything holds still.
         ===================================================================== */
      panTo(62, -14, 7.00, 0.70); // frame the chord

      // the two endpoint nodes warm up as the edge runs between them
      tl.to("#f08-n4", {
        borderColor: "rgba(29,86,240,0.55)",
        backgroundColor: "rgba(29,86,240,0.08)",
        duration: 0.45, ease: "power2.out"
      }, 7.45);

      draw("#f08-ret", 7.52, 0.90, "power2.out"); // the hero stroke

      popChev("#f08-retc", 8.00);

      tl.to("#f08-n1", {
        borderColor: "rgba(29,86,240,0.55)",
        backgroundColor: "rgba(29,86,240,0.08)",
        duration: 0.45, ease: "power2.out"
      }, 8.25);

      tl.to("#f08-arrow", { opacity: 1, scale: 1, duration: 0.26, ease: "power3.out" }, 8.30);

      // the loop's own caption lands inside the closed circuit
      tl.to("#f08-tag", { opacity: 1, scale: 1, duration: 0.42, ease: "back.out(1.4)" }, 8.55);

      // now the headline may finish its own sentence
      tl.to("#f08-h2b", { opacity: 1, y: 0, duration: 0.48, ease: "power3.out" }, 8.68);

      // 9.16 -> 9.70 : nothing moves. The completed loop holds.

      /* =====================================================================
         SCENE 4 (9.6-11.563s) — "a loop, not a checklist"
         One pull-back frames the whole ring, then the ring LOCKS.
         The landed pose is the neutral camera, so the node positions frames
         9-13 inherit are exactly the canvas coordinates above.
         ===================================================================== */
      tl.to(cam, {
        x: 0, y: 0, scale: 1.0,
        duration: 1.35, ease: "power3.out",
        onUpdate: applyCam
      }, 9.70);

      // 11.05 -> 11.563 : locked, still. No re-push, no drift, no exit.

      tl.seek(0);
    })();
  </script>
