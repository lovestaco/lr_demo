  <script>
    (function () {
      var ID = "08-heres-how";
      var $ = function (s) { return document.getElementById(ID + "-" + s); };
      var grid = $("grid");
      var cells = grid.querySelectorAll('[class~="08-heres-how-cell"]');
      var cellText = grid.querySelectorAll('[class~="08-heres-how-cell"] u, [class~="08-heres-how-cell"] em, [class~="08-heres-how-cell"] p');
      var words = $("line").querySelectorAll("span");
      var tl = gsap.timeline({ paused: true });

      // Persistent chrome: progress strip 31.3% -> 33.3% across the full 3s.
      tl.fromTo($("progress"), { width: "31.3%" }, { width: "33.3%", duration: 3, ease: "none" }, 0);

      // ---- Scene 1 (0.0-1.0s): the handoff grid is on stage at opacity 1 / scale 1 and is the

      // convergence point (960,496); the copy goes first, the borders dissolve last.

      tl.fromTo(cellText, { opacity: 1 }, { opacity: 0, duration: 0.3, ease: "power1.in", stagger: 0.035 }, 0.06);
      tl.fromTo(cells, { opacity: 1 }, { opacity: 0, duration: 0.46, ease: "power2.in", stagger: 0.03 }, 0.46);
      tl.fromTo($("box"), { opacity: 1 }, { opacity: 0, duration: 0.46, ease: "power2.in" }, 0.5);
      tl.set(grid, { opacity: 0 }, 1.0);

      // ---- Scene 2 (1.0-1.8s): the energy lands. A single ring pushes out of the convergence
      // point and the mark spring-blooms from zero, smooth long-tail settle, no overshoot.

        { scale: 2.3, opacity: 0, duration: 0.8, ease: "power2.out" }, 0.94);
      tl.fromTo($("mark"), { scale: 0, opacity: 0, rotation: -8 },
        { scale: 1, opacity: 1, rotation: 0, duration: 0.74, ease: "power3.out" }, 0.98);

      // holds dead still. This is the turn -- the stillness is the point.
