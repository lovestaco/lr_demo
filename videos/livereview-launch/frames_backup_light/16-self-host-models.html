  <script>
    (function () {
      var ID = "16-self-host-models";
      var $ = function (s) { return document.getElementById(ID + "-" + s); };
      var tl = gsap.timeline({ paused: true });

      var wordsA = $("lineA").querySelectorAll("span");
      var wordsB = $("lineB").querySelectorAll("span");
      var codeRows = [].slice.call($("code").children);

      // Persistent chrome: progress strip 70.3% -> 75.3% across the full 7.5s.
      tl.fromTo($("progress"), { width: "70.3%" }, { width: "75.3%", duration: 7.5, ease: "none" }, 0);

      /* ======================================================================
         Scene 1 (0.0-1.4s) — cue 1: "Keep your code in your infrastructure"
         The act chrome lands, the copy reveals per word, the BOUNDARY draws
         itself on, and the mark + code fade up INSIDE it.
         ====================================================================== */
      tl.fromTo($("act"), { opacity: 0, scale: 0.6 },
        { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(2.2)" }, 0.04);
      tl.fromTo([$("c1"), $("c2"), $("c3")], { opacity: 0, scale: 0.55 },
        { opacity: 1, scale: 1, duration: 0.36, ease: "power3.out", stagger: 0.06 }, 0.1);
      tl.fromTo($("c4"), { opacity: 0, scale: 0.3 },
        { opacity: 1, scale: 1, duration: 0.55, ease: "back.out(3.2)" }, 0.3);

      tl.fromTo($("rule"), { scaleX: 0, opacity: 0 },
        { scaleX: 1, opacity: 1, duration: 0.4, ease: "power2.out" }, 0.22);
      tl.fromTo(wordsA, { opacity: 0, y: 26, filter: "blur(6px)" },
        { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "power3.out", stagger: 0.085 }, 0.3);
      // the one cobalt word in the line settles on a small spring
      tl.fromTo($("em"), { scale: 0.86 }, { scale: 1, duration: 0.7, ease: "back.out(2.6)" }, 0.9);

      // the perimeter draws on (svg-path-draw, via a growing stroke mask)
      var bdraw = $("bdraw");
      var blen = (bdraw.getTotalLength ? bdraw.getTotalLength() : 2078) * 1.04;
      bdraw.style.strokeDasharray = String(blen);
      bdraw.style.strokeDashoffset = String(blen);
      tl.fromTo(bdraw, { strokeDashoffset: blen }, { strokeDashoffset: 0, duration: 0.95, ease: "power2.inOut" }, 0.45);
      tl.fromTo($("bfill"), { attr: { "fill-opacity": 0 } },
        { attr: { "fill-opacity": 0.03 }, duration: 0.6, ease: "power1.out" }, 1.05);

      // what the boundary holds: the LiveReview mark, then the code
      tl.fromTo($("mark"), { opacity: 0, scale: 0.45 },
        { opacity: 1, scale: 1, duration: 0.6, ease: "back.out(1.7)" }, 0.95);
      tl.fromTo($("word"), { opacity: 0, x: -18 },
        { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" }, 1.12);
      tl.fromTo(codeRows, { opacity: 0, x: -22 },
        { opacity: 1, x: 0, duration: 0.42, ease: "power2.out", stagger: 0.075 }, 1.2);

      /* ======================================================================
         Scene 2 (1.4-3.4s) — five provider marks spring in one by one along
         an arc OUTSIDE the perimeter. None of them crosses it.
         ====================================================================== */
      var arc = $("arc");
      var alen = (arc.getTotalLength ? arc.getTotalLength() : 416) * 1.02;
      arc.style.strokeDasharray = String(alen);
      arc.style.strokeDashoffset = String(alen);
      tl.fromTo(arc, { strokeDashoffset: alen }, { strokeDashoffset: 0, duration: 0.7, ease: "power2.out" }, 1.4);

      for (var i = 0; i < 5; i++) {
        var at = 1.58 + i * 0.3;
        tl.fromTo($("n" + i), { opacity: 0, scale: 0 },
          { opacity: 1, scale: 1, duration: 0.6, ease: "back.out(1.65)" }, at);
        tl.fromTo($("t" + i), { opacity: 0, x: -14 },
          { opacity: 1, x: 0, duration: 0.42, ease: "power2.out" }, at + 0.16);
      }

      /* ======================================================================
         Scene 3 (3.4-5.4s) — cue 2: "and choose which AI models inspect it."
         One mark is chosen: Claude scales 1.18x, the other four dim to 35%,
         and a thin connector draws from it and STOPS at the perimeter edge.
         ====================================================================== */
      tl.fromTo(wordsB, { opacity: 0, y: 22, filter: "blur(5px)" },
        { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "power3.out", stagger: 0.08 }, 3.45);

      var dimmed = [$("n0"), $("t0"), $("n1"), $("t1"), $("n3"), $("t3"), $("n4"), $("t4")];
      tl.fromTo(dimmed, { opacity: 1 }, { opacity: 0.35, duration: 0.6, ease: "power2.out" }, 4.3);

      tl.fromTo($("n2"), { scale: 1 }, { scale: 1.18, duration: 0.7, ease: "back.out(2)" }, 4.42);
      tl.fromTo($("t2"), { x: 0 }, { x: 10, duration: 0.7, ease: "back.out(2)" }, 4.42);
      tl.call(function () { $("t2").classList.add("on"); }, null, 4.42);

      // connector: drawn FROM the chip, arriving at x=1079 — the boundary edge.
      var link = $("link");
      var llen = Math.abs(1330 - 1079);
      link.style.strokeDasharray = String(llen);
      link.style.strokeDashoffset = String(llen);
      tl.fromTo(link, { strokeDashoffset: llen }, { strokeDashoffset: 0, duration: 0.6, ease: "power2.inOut" }, 4.72);

      // it meets a wall and does not enter: edge cap + a single ping, no loop.
      tl.fromTo($("wall"), { opacity: 0, attr: { "stroke-width": 2 } },
        { opacity: 1, attr: { "stroke-width": 4 }, duration: 0.3, ease: "power2.out" }, 5.24);
      tl.fromTo($("cap"), { opacity: 0, scale: 0.2 },
        { opacity: 1, scale: 1, duration: 0.28, ease: "back.out(3)", svgOrigin: "1079 660" }, 5.26);
      tl.fromTo($("ping"), { opacity: 0.75, scale: 1 },
        { opacity: 0, scale: 3.6, duration: 0.95, ease: "power2.out", svgOrigin: "1079 660" }, 5.32);
      tl.set($("ping"), { opacity: 0 }, 0);

      /* ======================================================================
         Scene 4 (5.4-7.5s) — the boundary names itself and the frame holds.
         ====================================================================== */
      tl.fromTo($("tag"), { opacity: 0, y: 14, scale: 0.82 },
        { opacity: 1, y: 0, scale: 1, duration: 0.65, ease: "back.out(2.1)" }, 5.52);

      // one slow, single-pass firming of the perimeter — the argument of the frame,
      // held rather than repeated. No loop, no exit.
      tl.fromTo($("bline"), { attr: { "stroke-opacity": 0.55 } },
        { attr: { "stroke-opacity": 0.78 }, duration: 1.0, ease: "sine.inOut" }, 6.25);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
