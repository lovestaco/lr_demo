  <script>
    (function () {
      var ID = "21-cta";
      var $ = function (part) { return document.getElementById(ID + "-" + part); };

      var ringInner = $("ring-inner");
      var ringOuter = $("ring-outer");
      var mark = $("mark");
      var wordLetters = Array.prototype.slice.call($("wordmark").querySelectorAll("span"));
      var urlPill = $("url");
      var urlChars = Array.prototype.slice.call(urlPill.querySelectorAll("span"));
      var progress = $("progress");

      // The four handed-off cells, each with its outward vector from the grid centre (960, 580).
      var cells = [
        { el: $("c1"), dx: -306, dy: -146 },
        { el: $("c2"), dx: 306, dy: -146 },
        { el: $("c3"), dx: -306, dy: 146 },
        { el: $("c4"), dx: 306, dy: 146 }
      ];

      var tl = gsap.timeline({ paused: true });

      // ---- Scene 1 (0.0-1.2s): the checked grid clears outward; the mark settles at centre ----
      // center-outward-expansion run OUTWARD: one shared centre, each cell driven along its own
      // radial vector (x1.55), scaling down and fading as it goes. Staggered, all gone by ~1.05s.
      cells.forEach(function (c, i) {
        tl.fromTo(c.el,
          { x: 0, y: 0, scale: 1, opacity: 1 },
          {
            x: c.dx * 0.55,
            y: c.dy * 0.55,
            scale: 0.72,
            opacity: 0,
            duration: 0.8,
            ease: "power2.in"
          }, 0.05 + i * 0.06);
      });

      // the mark is ALREADY at centre at t=0 (crossfade in from frame 20) and settles into place
      tl.fromTo(mark,
        { opacity: 0.5, scale: 0.92 },
        { opacity: 1, scale: 1, duration: 1.0, ease: "power2.out" }, 0);

      // closing-ring atmosphere eases open behind the lockup and is at rest well before the hold
      tl.fromTo(ringInner, { opacity: 0 }, { opacity: 1, duration: 1.0, ease: "power1.out" }, 0.1);
      tl.fromTo(ringOuter, { opacity: 0 }, { opacity: 0.6, duration: 1.0, ease: "power1.out" }, 0.2);
      tl.fromTo(ringInner, { scale: 0.94 }, { scale: 1, duration: 2.15, ease: "power2.out" }, 0.1);
      tl.fromTo(ringOuter, { scale: 0.94 }, { scale: 1, duration: 2.05, ease: "power2.out" }, 0.2);

      // cue 1 - "LiveReview" wordmark rises under the mark to complete the lockup
      tl.fromTo(wordLetters,
        { yPercent: 110 },
        { yPercent: 0, duration: 0.42, ease: "power3.out", stagger: 0.03 }, 0.8);

      // ---- Scene 2 (1.2-2.4s): cue 2 - the cobalt URL pill, typed letter by letter ----
      tl.fromTo(urlPill,
        { opacity: 0, scale: 0.9, y: 14 },
        { opacity: 1, scale: 1, y: 0, duration: 0.5, ease: "power3.out" }, 1.3);
      tl.fromTo(urlChars,
        { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: 0.28, ease: "power2.out", stagger: 0.028 }, 1.55);

      // the progress strip completes to 100% and comes to rest as the URL lands
      tl.fromTo(progress, { width: "96.7%" }, { width: "100%", duration: 2.4, ease: "none" }, 0);

      // ---- Scene 3 (2.4-5.0s): total stillness. Nothing tweens past 2.4s - 2.6s of dead hold,
      // long enough to read and type the URL. (The music bed fades beneath it at the root.)

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
