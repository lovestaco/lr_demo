  <script>
    (function () {
      var ID = "20-four-checks";
      var $ = function (s) { return document.getElementById(ID + "-" + s); };
      var cells = [$("c1"), $("c2"), $("c3"), $("c4")];
      var checks = [$("k1"), $("k2"), $("k3"), $("k4")];
      var labels = [$("l1"), $("l2"), $("l3"), $("l4")];

      var BORDER_COBALT = "rgba(29, 86, 240, 0.2)";
      var BORDER_GREEN = "rgba(5, 150, 105, 0.42)";
      var LABEL_GREY = "#909090";
      var LABEL_INK = "#05070b";

      var tl = gsap.timeline({ paused: true });

      // Persistent chrome: progress strip 91.7% -> 96.7% across the full 7.5s.
      tl.fromTo($("progress"), { width: "91.7%" }, { width: "96.7%", duration: 7.5, ease: "none" }, 0);

      // ---- Scene 1 (0.0-1.0s): eyebrow reveals and the Frame 7 2x2 rebuilds
      // INSTANTLY at the identical geometry, all four labels present and greyed. ----
      tl.fromTo($("rule"), { scaleX: 0, opacity: 0 },
        { scaleX: 1, opacity: 1, duration: 0.34, ease: "power3.out" }, 0.0);
      tl.fromTo($("lead"), { opacity: 0, y: 18, filter: "blur(6px)" },
        { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "power3.out" }, 0.06);

      // The motif returns as one piece — no re-assembly drama, it is already known.
      tl.fromTo($("box"), { opacity: 0 }, { opacity: 1, duration: 0.34, ease: "power2.out" }, 0.04);
      tl.fromTo(cells, { opacity: 0, y: 12 },
        { opacity: 1, y: 0, duration: 0.38, ease: "power3.out", stagger: 0.04 }, 0.06);

      // Checks are absent until their cell flips.
      tl.set(checks, { opacity: 0, scale: 0 }, 0);

      // ---- Per-cell flip: label -> near-black, green check spring-pops at the
      // cell's right edge, the cell border warms from cobalt to green. ----
      function flipCell(i, t) {
        tl.fromTo(labels[i], { color: LABEL_GREY },
          { color: LABEL_INK, duration: 0.42, ease: "power2.out" }, t);
        tl.fromTo(cells[i], { borderColor: BORDER_COBALT },
          { borderColor: BORDER_GREEN, duration: 0.55, ease: "power2.out" }, t + 0.06);
        tl.fromTo(checks[i], { opacity: 0, scale: 0.2 },
          { opacity: 1, scale: 1, duration: 0.6, ease: "back.out(3)" }, t + 0.1);
      }

      flipCell(0, 1.02); // Scene 2 (1.0-2.4s) — The attention problem
      flipCell(1, 2.42); // Scene 3 (2.4-3.8s) — The understanding problem
      flipCell(2, 3.82); // Scene 4 (3.8-5.2s) — The enforcement problem
      flipCell(3, 5.22); // Scene 5 (5.2-7.5s) — The control and improve problem

      // ---- Coda: all four checks pulse ONCE together (1.0 -> 1.07 -> 1.0), then the
      // grid holds completely still from 6.90s to the cut (handoff out to Frame 21). ----
      tl.fromTo(checks, { scale: 1 }, { scale: 1.07, duration: 0.2, ease: "power2.out" }, 6.45);
      tl.fromTo(checks, { scale: 1.07 }, { scale: 1, duration: 0.25, ease: "power2.inOut" }, 6.65);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
