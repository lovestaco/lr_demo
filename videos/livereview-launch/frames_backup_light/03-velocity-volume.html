  <div data-hf-id="hf-phbv" id="root" data-composition-id="03-velocity-volume" data-width="1920" data-height="1080" data-duration="6">
    <div data-hf-id="hf-jmii" id="03-velocity-volume-bg" class="clip" data-start="0" data-duration="6" data-track-index="0"></div>

    <div data-hf-id="hf-ibw6" id="03-velocity-volume-field"></div>

    <div data-hf-id="hf-jvvm" id="03-velocity-volume-mass"></div>
    <div data-hf-id="hf-dzlu" id="03-velocity-volume-stack"></div>
    <div data-hf-id="hf-83pm" id="03-velocity-volume-hair"></div>

    <div data-hf-id="hf-8nbz" id="03-velocity-volume-eyebrow">Here’s why:</div>

    <div data-hf-id="hf-gb08" id="03-velocity-volume-head"><span data-hf-id="hf-gcjs">Code</span> <span data-hf-id="hf-2vno">accumulates</span> <span data-hf-id="hf-ypng">at</span> <span data-hf-id="hf-9zpm">great</span> <span data-hf-id="hf-46wt" class="03-velocity-volume-hl">VELOCITY<i data-hf-id="hf-wt6k"></i></span></div>

    <div data-hf-id="hf-toe4" id="03-velocity-volume-scrim"></div>
    <div data-hf-id="hf-tld9" id="03-velocity-volume-land">
      <div data-hf-id="hf-qerk" id="03-velocity-volume-land-a">The higher velocity leads to</div>
      <div data-hf-id="hf-ja7g" id="03-velocity-volume-land-b"><span data-hf-id="hf-mvnc" id="03-velocity-volume-land-hero">HUGE VOLUME</span><span data-hf-id="hf-8mo7" id="03-velocity-volume-land-tail">&#160;of code</span></div>
    </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script>
    (function () {
      var ID = "03-velocity-volume";
      var $ = function (s) { return document.getElementById(ID + "-" + s); };

      /* ---------- deterministic pseudo-random (fixed seed, resolved at build) ---------- */
      var seed = 20250930;
      function rnd() {
        seed = (seed * 1664525 + 1013904223) >>> 0;
        return seed / 4294967296;
      }
      function segs(el, total) {
        var n = 2 + Math.floor(rnd() * 3); // 2..4 tokens per code line
        var avail = total - 14 * (n - 1);
        var parts = [], sum = 0, k, v;
        for (k = 0; k < n; k++) { v = 0.5 + rnd(); parts.push(v); sum += v; }
        for (k = 0; k < n; k++) {
          var i = document.createElement("i");
          i.style.width = Math.max(28, Math.round(avail * parts[k] / sum)) + "px";
          el.appendChild(i);
        }
      }

      /* ---------- Scene 2 field: 30 runners streaking right -> left ---------- */
      var field = $("field");
      var runners = [];
      var LAYER_DUR = [0.70, 0.88, 1.05];
      for (var i = 0; i < 30; i++) {
        var layer = i % 3;
        var w = 260 + Math.round(rnd() * 620);
        var y = 300 + Math.round(rnd() * 540);
        var d = document.createElement("div");
        d.className = ID + "-ln " + ID + "-l" + layer;
        d.style.left = "1980px";
        d.style.top = y + "px";
        d.style.width = w + "px";
        segs(d, w);
        field.appendChild(d);
        runners.push({ el: d, w: w, start: 1.45 + rnd() * 0.70, dur: LAYER_DUR[layer] });
      }

      /* ---------- Scene 3 stack: 18 rows that halt, then fall into the mass ---------- */
      var stack = $("stack");
      var IND = [0, 1, 1, 2, 2, 1, 0, 1, 2, 2, 3, 2, 1, 1, 2, 1, 0, 1];
      var rows = [];
      for (var k = 0; k < 18; k++) {
        var top = 868 - k * 24;
        var left = 204 + IND[k] * 34;
        var rw = Math.min(340 + Math.round(rnd() * 820), 1716 - left);
        var r = document.createElement("div");
        r.className = ID + "-row";
        r.style.left = left + "px";
        r.style.top = top + "px";
        r.style.width = rw + "px";
        segs(r, rw);
        stack.appendChild(r);
        rows.push({
          el: r,
          fromY: -(90 + Math.round(rnd() * 165)),
          enterX: 1540 + Math.round(rnd() * 1100),
          enterStart: 2.28 + rnd() * 0.58,
          fallStart: 3.30 + k * 0.068
        });
      }

      /* ---------- one paused timeline ---------- */
      var tl = gsap.timeline({ paused: true });

      /* persistent chrome: progress strip 10.3% -> 14.3% */
      tl.fromTo($("progress"), { width: "10.3%" }, { width: "14.3%", duration: 6, ease: "none" }, 0);

      /* ===== Scene 1 (0.0-1.3s): "Here's why:" alone, big + centered, holds a beat,
         then shrinks up into the eyebrow slot top-left as the frame opens out. ===== */
      tl.fromTo($("eyebrow"),
        { opacity: 0, x: 526, y: 318, scale: 3.9 },
        { opacity: 1, x: 526, y: 318, scale: 4.6, duration: 0.38, ease: "back.out(2.1)" }, 0);
      tl.to($("eyebrow"), { x: 0, y: 0, scale: 1, duration: 0.5, ease: "power3.inOut" }, 0.85);
      tl.to($("eyebrow"), { color: "#1d56f0", duration: 0.4, ease: "none" }, 0.95);

      /* ===== Scene 2 (1.3-3.2s): the statement builds per word; behind it the code-line
         field streaks in from the right at speed and exits left — a RATE. ===== */
      var words = $("head").querySelectorAll("span:not([class])");
      var hl = $("head").querySelector("[class]");
      tl.fromTo(words,
        { opacity: 0, y: 26, filter: "blur(7px)" },
        { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.46, ease: "power3.out", stagger: 0.085 }, 1.34);
      tl.fromTo(hl,
        { opacity: 0, y: 26, scale: 0.9, filter: "blur(8px)" },
        { opacity: 1, y: 0, scale: 1, filter: "blur(0px)", duration: 0.5, ease: "back.out(2)" }, 1.72);
      tl.fromTo(hl.querySelector("i"), { scaleX: 0 }, { scaleX: 1, duration: 0.34, ease: "power2.out" }, 2.12);

      runners.forEach(function (r) {
        tl.fromTo(r.el, { x: 0 }, { x: -(1980 + r.w + 120), duration: r.dur, ease: "none" }, r.start);
      });

      /* ===== Scene 3 (3.2-5.0s): the streak stops dead, then the lines on screen FALL
         and stack into a dense mass; a red hairline rides the top of the pile. ===== */
      rows.forEach(function (r) {
        // streak leg: constant speed, every row halting exactly at 3.2s
        var travel = 3.2 - r.enterStart;
        tl.fromTo(r.el,
          { x: r.enterX, y: r.fromY },
          { x: 0, y: r.fromY, duration: travel, ease: "none" }, r.enterStart);
        tl.fromTo(r.el, { opacity: 0 }, { opacity: 1, duration: 0.16, ease: "none" }, r.enterStart);
        // velocity smear on the same window + ease, sharp the instant it stops
        tl.fromTo(r.el, { filter: "blur(7px)" }, { filter: "blur(0px)", duration: travel, ease: "none" }, r.enterStart);
        // the fall
        tl.fromTo(r.el, { y: r.fromY }, { y: 0, duration: 0.40, ease: "power2.in" }, r.fallStart);
      });

      tl.fromTo($("mass"), { opacity: 0 }, { opacity: 1, duration: 0.18, ease: "none" }, 3.30);
      tl.fromTo($("mass"), { scaleY: 0 }, { scaleY: 1, duration: 1.58, ease: "none" }, 3.32);
      tl.fromTo($("hair"), { opacity: 0 }, { opacity: 1, duration: 0.18, ease: "none" }, 3.30);
      tl.fromTo($("hair"), { y: 454 }, { y: 0, duration: 1.58, ease: "none" }, 3.32);

      /* ===== Scene 4 (5.0-6.0s): the payoff line lands over the still mass. ===== */
      tl.to($("stack"), { opacity: 0.55, duration: 0.45, ease: "power2.out" }, 5.0);
      tl.fromTo($("scrim"), { opacity: 0 }, { opacity: 1, duration: 0.45, ease: "power2.out" }, 5.0);
      tl.fromTo($("land-a"),
        { opacity: 0, y: 30, filter: "blur(9px)" },
        { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.52, ease: "power3.out" }, 5.04);
      tl.fromTo($("land-hero"),
        { opacity: 0, y: 26, scale: 0.86, filter: "blur(10px)" },
        { opacity: 1, y: 0, scale: 1, filter: "blur(0px)", duration: 0.6, ease: "back.out(2.2)" }, 5.28);
      tl.fromTo($("land-tail"),
        { opacity: 0, y: 18 },
        { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, 5.5);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
