    (function () {
      var ID = "14-enforcement-answer";
      var $ = function (s) { return document.getElementById(ID + "-" + s); };
      var tl = gsap.timeline({ paused: true });

      var COBALT = "#1d56f0";
      var INK = "#05070b";

      // Persistent chrome: progress strip 58.7% -> 67.3% across the full 13s.
      tl.fromTo($("progress"), { width: "58.7%" }, { width: "67.3%", duration: 13, ease: "none" }, 0);

      // ---- Scene 1 (0.0-2.0s) — cue A. Act chrome, the title, then the five stops

      var cells = [$("q1"), $("q2"), $("q3"), $("q4")];
      tl.fromTo(cells, { opacity: 0, scale: 0.55 },
        { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(2)", stagger: 0.06 }, 0.05);

      tl.fromTo($("title").querySelectorAll("span"), { opacity: 0, y: 28, filter: "blur(6px)" },
        { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "power3.out", stagger: 0.07 }, 0.1);

      // the grey connector draws first, the cobalt fill then travels stop to stop
      tl.fromTo($("track"), { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power2.out" }, 0.22);
      tl.set($("fill"), { scaleX: 0 }, 0);
      tl.fromTo($("rail").querySelectorAll(".hf14-off"), { opacity: 0, scale: 0.7 },
        { opacity: 1, scale: 1, duration: 0.32, ease: "power3.out", stagger: 0.07 }, 0.3);

      for (var i = 0; i < 5; i++) {
        var at = 0.45 + i * 0.3;
        tl.fromTo($("on" + (i + 1)), { opacity: 0, scale: 0.35 },
          { opacity: 1, scale: 1, duration: 0.36, ease: "back.out(3)" }, at);
        tl.fromTo($("lb" + (i + 1)), { opacity: 0, y: 16 },
          { opacity: 1, y: 0, duration: 0.42, ease: "power3.out" }, at + 0.05);
        if (i < 4) {
          tl.fromTo($("fill"), { scaleX: i / 4 },
            { scaleX: (i + 1) / 4, duration: 0.3, ease: "power2.inOut", immediateRender: false }, at + 0.05);
        }
      }

      // all five halos start dark; only the active stop ever shows one
      tl.set([$("halo1"), $("halo2"), $("halo3"), $("halo4"), $("halo5")], { opacity: 0 }, 0);
      tl.set($("marker"), { opacity: 0 }, 0);
      tl.set($("ping"), { opacity: 0 }, 0);

      // ---- Scene 2 (2.0-2.9s) — cue B. The rail shrinks and docks under the title,
      // the sub-line lands, and the window shell rises into 230,346 1460x658.
      tl.fromTo($("rail"), { scale: 1 }, { scale: 0.62, duration: 0.6, ease: "power3.inOut" }, 2.0);
      tl.fromTo($("sub"), { opacity: 0, y: 18, filter: "blur(5px)" },
        { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.55, ease: "power3.out" }, 2.05);
      // lands fully at rest at 2.87s — before the first clip's data-start (2.9s) — and never moves again
      tl.fromTo($("win"), { opacity: 0, y: 150 }, { opacity: 1, y: 0, duration: 0.72, ease: "expo.out" }, 2.15);

      // ---- Scene 3 (2.9-6.9s) — clip08_schedule plays in the window rect.
      // The "schedule" stop carries the highlight; the frame is otherwise still.
      tl.fromTo($("halo5"), { opacity: 0, scale: 0.6 },
        { opacity: 1, scale: 1, duration: 0.45, ease: "power3.out", immediateRender: false }, 2.95);
      tl.fromTo($("lb5"), { color: INK }, { color: COBALT, duration: 0.35, ease: "none", immediateRender: false }, 2.95);
      tl.fromTo($("marker"), { opacity: 0, scaleX: 0.25, x: 249.24 },
        { opacity: 1, scaleX: 1, x: 249.24, duration: 0.42, ease: "power3.out", immediateRender: false }, 2.98);

      // ---- Scene 4 (6.9-11.9s) — HARD CUT inside the window to clip10_cicd at rate 1.333.
      // The highlight travels from "schedule" back to "CI/CD" on the cut. The shell does not move.
      tl.fromTo($("halo5"), { opacity: 1 }, { opacity: 0, duration: 0.28, ease: "power2.out", immediateRender: false }, 5.9);
      tl.fromTo($("lb5"), { color: COBALT }, { color: INK, duration: 0.3, ease: "none", immediateRender: false }, 5.9);
      tl.fromTo($("marker"), { x: 249.24 }, { x: 0, duration: 0.5, ease: "power3.inOut", immediateRender: false }, 5.9);
      tl.fromTo($("halo4"), { opacity: 0, scale: 0.6 },
        { opacity: 1, scale: 1, duration: 0.45, ease: "power3.out", immediateRender: false }, 5.98);
      tl.fromTo($("lb4"), { color: INK }, { color: COBALT, duration: 0.35, ease: "none", immediateRender: false }, 5.98);

      // one-shot ping on the active stop, mid-clip (not a loop)
      tl.fromTo($("ping"), { opacity: 0.65, scale: 1 },
        { opacity: 0, scale: 4.5, duration: 1.2, ease: "power2.out", immediateRender: false }, 9.5);

      // ---- Scene 5 (11.0-13.0s) — cue C. The window fades down and the seal resolves
      // in the established position, then holds still.
      tl.fromTo($("win"), { opacity: 1, scale: 1 },
        { opacity: 0, scale: 0.965, duration: 0.3, ease: "power2.in", immediateRender: false }, 11.0);

      tl.fromTo($("seal-a"), { opacity: 0, y: 26, filter: "blur(6px)" },
        { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.48, ease: "power3.out" }, 11.05);
      tl.fromTo($("seal-b"), { opacity: 0, scale: 0.6 },
        { opacity: 1, scale: 1, duration: 0.42, ease: "back.out(2.4)" }, 11.45);
      tl.fromTo($("seal-c"), { opacity: 0, scale: 0 },
        { opacity: 1, scale: 1, duration: 0.36, ease: "back.out(3)" }, 11.58);

      var tick = $("tick");
      var L = 36;
      try { var m = tick.getTotalLength(); if (m && isFinite(m) && m > 0) L = m; } catch (e) {}
      tick.style.strokeDasharray = String(L);
      tl.fromTo(tick, { strokeDashoffset: L }, { strokeDashoffset: 0, duration: 0.3, ease: "power2.out" }, 11.68);

      // hold to the full frame length
      tl.set({}, {}, 13);

      window.__timelines = window.__timelines || {};
