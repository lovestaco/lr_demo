  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script>
    (function () {
      var ID = "06-more-code-means";
      var $ = function (s) { return document.getElementById(ID + "-" + s); };
      var kids = function (s) { return Array.prototype.slice.call($(s).children); };

      // Deterministic dash length per link, computed from its hardcoded endpoints.
      var prep = function (group) {
        var lines = kids(group);
        lines.forEach(function (ln) {
          var len = Math.hypot(
            +ln.getAttribute("x2") - +ln.getAttribute("x1"),
            +ln.getAttribute("y2") - +ln.getAttribute("y1")
          );
          ln.setAttribute("data-len", len);
          ln.style.strokeDasharray = len;
          ln.style.strokeDashoffset = len;
        });
        return lines;
      };
      var linksA = prep("la");
      var linksB = prep("lb");
      var linksC = prep("lc");
      var nodesA = kids("na");
      var nodesC = kids("nc");

      var drawIn = function (tl, lines, at, dur, stagger) {
        lines.forEach(function (ln, i) {
          var len = +ln.getAttribute("data-len");
          tl.fromTo(ln,
            { strokeDashoffset: len, opacity: 0 },
            { strokeDashoffset: 0, opacity: 1, duration: dur, ease: "power2.out" },
            at + i * stagger);
        });
      };

      var anchorWords = $("anchor").querySelectorAll("span");
      var c1Words = $("c1").querySelectorAll("span");
      var c2Words = $("c2").querySelectorAll("span");

      var tl = gsap.timeline({ paused: true });

      // Persistent chrome: progress strip 22.3% -> 26.0% across the whole frame.
      tl.fromTo($("progress"), { width: "22.3%" }, { width: "26.0%", duration: 5.5, ease: "none" }, 0);

      // Pre-states for the Scene-3 waterfall entry (so un-started words never sit visible).
      tl.set(c2Words, { opacity: 0, x: 230 }, 0);

      // ---------------------------------------------------------------
      // Scene 1 (0.0-1.2s) — the anchor lands and PINS; sparse graph at 18%.
      // ---------------------------------------------------------------
      tl.fromTo($("wash"), { opacity: 0 }, { opacity: 1, duration: 1.6, ease: "power2.out" }, 0);
      tl.fromTo($("rule"), { scaleX: 0, opacity: 0 },
        { scaleX: 1, opacity: 1, duration: 0.4, ease: "power3.out" }, 0.04);
      // word-by-word build of the anchor line — it holds this position for the rest of the clip
      tl.fromTo(anchorWords,
        { opacity: 0, y: 28, filter: "blur(8px)" },
        { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.55, ease: "power3.out", stagger: 0.1 }, 0.12);
      // the graph field itself sits at 18% behind the right two-thirds
      tl.fromTo($("graph"), { opacity: 0 }, { opacity: 0.18, duration: 0.7, ease: "power2.out" }, 0.4);
      tl.fromTo(nodesA, { opacity: 0, scale: 0 },
        { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(2.4)", stagger: 0.055 }, 0.45);
      drawIn(tl, linksA, 0.55, 0.45, 0.07);

      // ---------------------------------------------------------------
      // Scene 2 (1.2-3.0s) — consequence 1 reveals in the slot; the graph
      // grows LINKS between the existing nodes (no new nodes here).
      // ---------------------------------------------------------------
      tl.fromTo(c1Words,
        { opacity: 0, y: 22, filter: "blur(6px)" },
        { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "power3.out", stagger: 0.08 }, 1.25);
      drawIn(tl, linksB, 1.55, 0.5, 0.2);

      // ---------------------------------------------------------------
      // Scene 3 (3.0-5.5s) — waterfall cut at t=3.0: consequence 1 rips out
      // word by word, consequence 2 cascades in mid-flight in the SAME slot.
      // Behind it the node count doubles and the links tangle to ~28%.
      // ---------------------------------------------------------------
      // exit half of the cut — each word ramps left on power4.in, fading early
      tl.fromTo(c1Words, { x: 0 },
        { x: -230, duration: 0.34, ease: "power4.in", stagger: 0.022 }, 2.75);
      tl.fromTo(c1Words, { opacity: 1 },
        { opacity: 0, duration: 0.18, ease: "power1.in", stagger: 0.022 }, 2.75);
      // entry half — mirrored velocity, cascade with shrinking gaps
      var gaps = [0, 0.05, 0.092, 0.1273];
      Array.prototype.forEach.call(c2Words, function (w, i) {
        tl.fromTo(w, { x: 230, opacity: 0.35 },
          { x: 0, opacity: 1, duration: 0.3, ease: "power4.out" }, 3.0 + gaps[i]);
      });

      // the world densifies around the unmoved anchor
      tl.fromTo($("graph"), { opacity: 0.18 }, { opacity: 0.28, duration: 1.0, ease: "power1.inOut" }, 3.0);
      tl.fromTo(nodesC, { opacity: 0, scale: 0 },
        { opacity: 1, scale: 1, duration: 0.32, ease: "back.out(2.4)", stagger: 0.1 }, 3.1);
      drawIn(tl, linksC, 3.25, 0.5, 0.095);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
