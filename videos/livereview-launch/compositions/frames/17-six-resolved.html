  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      var TOTAL = 13;

      /* =========================================================
         Scene 1 (0.0-1.4) — RECOGNITION. Frame 03's picture comes
         back whole: same title, same eyebrow, same six rows, same
         red crosses. No build, no per-part cascade — the list is
         already known, so it simply re-lands in its slots.
         ========================================================= */
      tl.fromTo("#n17-eyebrow",
        { opacity: 0, y: 14 },
        { opacity: 1, y: 0, duration: 0.42, ease: "power3.out" }, 0.05);

      /* the problem title fills word-by-word, quick — it is a reprise, not a reveal */
      gsap.utils.toArray("#n17-h2a .n17-word").forEach(function (word, i) {
        tl.fromTo(word,
          { opacity: 0, y: 22 },
          { opacity: 1, y: 0, duration: 0.50, ease: "power3.out" }, 0.10 + i * 0.055);
      });

      tl.fromTo("#n17-rail",
        { scaleY: 0, opacity: 0 },
        { scaleY: 1, opacity: 1, duration: 0.60, ease: "power3.out" }, 0.10);

      /* center-outward-expansion, short-path form — 03's own numbers */
      var START_PROGRESS = 0.85;
      var ENTER_AT = 0.20;
      var ENTER_GAP = 0.075;
      var ENTER_DUR = 0.58;

      var rows = gsap.utils.toArray(".n17-row");

      rows.forEach(function (row, i) {
        var at = ENTER_AT + i * ENTER_GAP;
        var targetY = Number(row.dataset.targetY);

        tl.fromTo(row,
          { yPercent: -50, y: targetY * START_PROGRESS, scale: 0.96, opacity: 0 },
          { yPercent: -50, y: targetY, scale: 1, opacity: 1,
            duration: ENTER_DUR, ease: "power3.out" }, at);

        /* the problem consequence mask-wipes open, exactly as it did in 03 */
        tl.fromTo(row.querySelector(".n17-cons-out"),
          { clipPath: "inset(0 100% 0 0)", opacity: 0 },
          { clipPath: "inset(0 0% 0 0)", opacity: 1,
            duration: 0.50, ease: "power2.out" }, at + 0.12);
      });

      /* =========================================================
         Scene 2 (1.4-2.2) — the frame turns. The eyebrow HARD-SWAPS
         (discrete-text-sequence: whole-state replacement at a
         threshold, no tween between states) and the title
         crossfades to the answering line.
         ========================================================= */
      var EYEBROW_SEQ = [
        { t: 0.00, text: "Today" },
        { t: 1.45, text: "With LiveReview" }
      ];
      function eyebrowAt(time) {
        for (var i = EYEBROW_SEQ.length - 1; i >= 0; i--) {
          if (time >= EYEBROW_SEQ[i].t) return EYEBROW_SEQ[i].text;
        }
        return EYEBROW_SEQ[0].text;
      }
      var eyebrowEl = document.getElementById("n17-eyebrow");
      var driver = { t: 0 };
      tl.to(driver, {
        t: TOTAL, duration: TOTAL, ease: "none",
        onUpdate: function () { eyebrowEl.textContent = eyebrowAt(driver.t); }
      }, 0);

      tl.to("#n17-h2a",
        { opacity: 0, y: -12, duration: 0.30, ease: "power2.in" }, 1.45);
      tl.fromTo("#n17-h2b",
        { opacity: 0, y: 16 },
        { opacity: 1, y: 0, duration: 0.46, ease: "power3.out" }, 1.58);

      /* =========================================================
         Scene 3 (2.2-10.6) — the transformation. One row resolves
         every 1.4s, top to bottom, the same cadence 03 built on so
         the two frames rhyme. Per row (scale-swap-transition):
           ring   #dc2626 -> #059669 with a confirm pulse
           glyph  cross shrinks away, check pops in and draws
           text   problem consequence swaps for the resolved one
         ========================================================= */
      var RESOLVE_AT = 2.20;
      var RESOLVE_GAP = 1.40;
      var EXIT_SCALE = 0.82;

      rows.forEach(function (row, i) {
        var t = RESOLVE_AT + i * RESOLVE_GAP;
        var mark = row.querySelector(".n17-mark");

        /* ring recolours to the positive token */
        tl.fromTo(mark,
          { borderColor: "rgba(220, 38, 38, 0.3)", backgroundColor: "rgba(220, 38, 38, 0.06)" },
          { borderColor: "rgba(5, 150, 105, 0.35)", backgroundColor: "rgba(5, 150, 105, 0.08)",
            duration: 0.42, ease: "power2.out" }, t);

        /* confirm pulse — out then settle, no repeat/yoyo */
        tl.fromTo(mark,
          { scale: 1 },
          { scale: 1.13, duration: 0.16, ease: "power2.out" }, t);
        tl.to(mark,
          { scale: 1, duration: 0.34, ease: "back.out(2.2)" }, t + 0.16);

        /* outgoing cross: shrink + fade, fast power2.in */
        tl.fromTo(row.querySelector(".n17-gx"),
          { scale: 1, opacity: 1 },
          { scale: 0.62, opacity: 0, duration: 0.30, ease: "power2.in" }, t + 0.04);

        /* incoming check: arrives with weight, on top of the outgoing */
        tl.fromTo(row.querySelector(".n17-gc"),
          { scale: 0.62, opacity: 0 },
          { scale: 1, opacity: 1, duration: 0.50, ease: "back.out(1.7)" }, t + 0.20);

        /* svg-path-draw — the check scribes itself as it lands */
        tl.fromTo(row.querySelector(".n17-check"),
          { strokeDashoffset: 17 },
          { strokeDashoffset: 0, duration: 0.34, ease: "power2.out" }, t + 0.26);

        /* consequence swap — a beat behind the marker, so the eye
           reads the flip first and the new wording second */
        tl.to(row.querySelector(".n17-cons-out"),
          { scale: EXIT_SCALE, opacity: 0, duration: 0.34, ease: "power2.in" }, t + 0.26);
        tl.fromTo(row.querySelector(".n17-cons-in"),
          { scale: EXIT_SCALE, opacity: 0 },
          { scale: 1, opacity: 1, duration: 0.52, ease: "back.out(1.4)" }, t + 0.46);
      });

      /* =========================================================
         Scene 4 (10.6-13.0) — all six hold green and still. The
         film's whole argument, readable as one picture. No exit:
         frames 18 and 19 follow, and the root transition is the cut.
         ========================================================= */
      tl.set("#n17-rail", { opacity: 1 }, TOTAL);

      window.__timelines["17-six-resolved"] = tl;
      tl.seek(0);
    })();
  </script>
