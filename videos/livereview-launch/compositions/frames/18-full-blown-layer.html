      var cells = [$("q1"), $("q2"), $("q3"), $("q4")];

      var tl = gsap.timeline({ paused: true });

         final beat is total stillness — nothing on the canvas moves after 4.32s. */
      tl.fromTo($("progress"), { width: "83.7%" }, { width: "87%", duration: LANDED, ease: "none" }, 0);

      /* ---------- Scene 1 (0.0-1.6s) ----------
         All four quadrant cells are already FILLED cobalt — the callback that
         says every problem is answered. They land fast, hold, then dissolve. */

        { opacity: 0, scale: 0.72 },
        { opacity: 1, scale: 1, duration: 0.34, ease: "power3.out", stagger: 0.06 }, 0.0);

      // The "why" reveals per word beneath, grey and small — understated on purpose.

        { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.46, ease: "power3.out", stagger: 0.06 }, 0.36);
