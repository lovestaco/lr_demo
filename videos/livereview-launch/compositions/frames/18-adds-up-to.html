      /* --- svg-path-draw setup: measured length, fixed fallback (deterministic) --- */
      function arm(el, fallback) {
        if (!el) return 0;
        var L = fallback;
        try { var m = el.getTotalLength(); if (m && m > 1) L = m; } catch (e) { L = fallback; }

      var c1 = q('.f14-c1'), c2 = q('.f14-c2'), c3 = q('.f14-c3');

        var gap = 0.05, off = 0;
        for (var i = 0; i < words.length; i++) {
          tl.fromTo(words[i],
            { x: 230, opacity: 0 },
            { x: 0, opacity: 1, duration: 0.30, ease: "power4.out" },
            at + off);
          off += gap; gap *= 0.84;

      /* ================= Scene 1 (0.0–3.2) — clause one, beat-slam ================= */

        { opacity: 0, scale: 1.14, x: -30, filter: "blur(14px)" },

      waterfall(w2, 3.30);
      tl.fromTo(g2, { opacity: 0 }, { opacity: 0.22, duration: 0.45, ease: "power1.out" }, 4.25);
      tl.to(q('.f14-g2-top'), { strokeDashoffset: 0, duration: 0.50, ease: "power2.out" }, 4.30);
      tl.to(q('.f14-g2-bot'), { strokeDashoffset: 0, duration: 0.50, ease: "power2.out" }, 4.50);
