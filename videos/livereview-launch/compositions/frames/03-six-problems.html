    .n03-bg { position: absolute; inset: 0; background: #ffffff; }

    /* ---------- center-outward-expansion wrap ----------

    .n03-burst { position: absolute; inset: 0; }

    .n03-row {
      position: absolute; left: 110px; top: 50%;

    /* enumeration — the viewer must be able to COUNT the list, not just read it */
    .n03-idx {

    }

    /* card-tinted — 4% cobalt fill, 20% cobalt 1.5px border, 14px radius, no shadow */
    .n03-card {
      position: absolute; left: 94px; top: 0; width: 1606px; height: 92px;
      box-sizing: border-box;
      background: rgba(29, 86, 240, 0.04);
      border: 1.5px solid rgba(29, 86, 240, 0.2);
      border-radius: 14px;
    }

    /* negative marker — ring + drawn-in cross. Inline negative only, never a fill. */
    .n03-mark {
      position: absolute; left: 26px; top: 23px; width: 46px; height: 46px;

      border: 1.5px solid rgba(220, 38, 38, 0.3);

    .n03-glyph {

      overflow: visible;
    }
    .n03-stroke {
      stroke: #dc2626; stroke-width: 3; stroke-linecap: round; fill: none;
      stroke-dasharray: 15; stroke-dashoffset: 15;
    }

    .n03-label {
      position: absolute; left: 100px; top: 0; height: 92px; line-height: 92px;
      font-size: 38px; font-weight: 600; letter-spacing: -.01em;
      color: #05070b; white-space: nowrap;
    }
    .n03-cons {
      position: absolute; left: 700px; top: 0; height: 92px; line-height: 92px;
      font-size: 31px; font-weight: 400;
      color: #1648cf; white-space: nowrap;
      clip-path: inset(0 100% 0 0);
    }
  </style>

  <div id="root" data-composition-id="03-six-problems"

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      /* =========================================================
         Scene 1 (0.0-1.7) — the title sets upper-left and the
         EMPTY list rail draws beneath it. Nothing else exists yet.
         ========================================================= */
      tl.fromTo(".n03-eyebrow",
        { opacity: 0, y: 14 },
        { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 0.10);

      /* per-word headline fill — word starts pre-computed once from
         content length, never inside an onUpdate */
      var WORD_BASE = 0.10;
      var SEC_PER_CHAR = 0.016;
      var cursor = 0.28;
      gsap.utils.toArray(".n03-word").forEach(function (word) {
        tl.fromTo(word,
          { opacity: 0, y: 24 },
          { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" }, cursor);
        cursor += WORD_BASE + word.textContent.length * SEC_PER_CHAR;
      });

      /* the rail draws top-down and lands exactly as row 01 arrives */
      tl.fromTo("#n03-rail",
        { scaleY: 0, opacity: 0 },
        { scaleY: 1, opacity: 1, duration: 0.62, ease: "power3.out" }, 1.06);

      /* =========================================================
         Scene 2 (1.7-11.0) — the six rows arrive ONE AT A TIME,
         1.55s apart. Silent film: that gap IS the read time.

         center-outward-expansion, short-path form: every row shares
         ONE origin (the stage centre) and lerps outward to its slot
         via data-target-y. START_PROGRESS keeps the travel short, so
         rows near the centre barely move and the outer rows swing
         furthest — the expansion gradient without the pile-up.
         ========================================================= */
      var ROW_AT = 1.70;          /* ENTRY_AT */
      var ROW_GAP = 1.55;         /* one row per read-beat */
      var START_PROGRESS = 0.85;
      var EXPAND_DUR = 0.62;
      var EXPAND_EASE = "power3.out";   /* out-easing only */

      gsap.utils.toArray(".n03-row").forEach(function (row, i) {
        var at = ROW_AT + i * ROW_GAP;
        var targetY = Number(row.dataset.targetY);

        /* the slot arrives (empty tinted card), expanding outward from centre */
        tl.fromTo(row,
          { yPercent: -50, y: targetY * START_PROGRESS, scale: 0.96, opacity: 0 },
          { yPercent: -50, y: targetY, scale: 1, opacity: 1,
            duration: EXPAND_DUR, ease: EXPAND_EASE }, at);

        /* then the row fills itself in reading order: index -> mark -> label -> consequence */
        tl.fromTo(row.querySelector(".n03-idx"),
          { opacity: 0, x: -12 },
          { opacity: 1, x: 0, duration: 0.45, ease: "power2.out" }, at + 0.12);

        tl.fromTo(row.querySelector(".n03-mark"),
          { scale: 0, opacity: 0 },
          { scale: 1, opacity: 1, duration: 0.46, ease: "back.out(1.7)" }, at + 0.18);

        /* svg-path-draw — the cross scribes itself, stroke after stroke */
        var strokes = row.querySelectorAll(".n03-stroke");
        tl.fromTo(strokes[0],
          { strokeDashoffset: 15 },
          { strokeDashoffset: 0, duration: 0.20, ease: "power2.out" }, at + 0.38);
        tl.fromTo(strokes[1],
          { strokeDashoffset: 15 },
          { strokeDashoffset: 0, duration: 0.20, ease: "power2.out" }, at + 0.54);

        tl.fromTo(row.querySelector(".n03-label"),
          { opacity: 0, x: 22 },
          { opacity: 1, x: 0, duration: 0.52, ease: "power3.out" }, at + 0.30);

        /* the consequence mask-wipes open left-to-right, a beat behind the
           label, so the eye reads the name first and the cost second */
        tl.fromTo(row.querySelector(".n03-cons"),
          { clipPath: "inset(0 100% 0 0)", opacity: 0 },
          { clipPath: "inset(0 0% 0 0)", opacity: 1,
            duration: 0.64, ease: "power2.out" }, at + 0.62);
      });

      /* =========================================================
         Scene 3 (11.0-13.0) — deliberate held read. All six sit
         together, motionless, so the list can be taken in as ONE
         picture. Frame 17 answers this exact composition.
         ========================================================= */
      tl.set("#n03-rail", { opacity: 1 }, 13);

      window.__timelines["03-six-problems"] = tl;
      tl.seek(0);
    })();
  </script>
