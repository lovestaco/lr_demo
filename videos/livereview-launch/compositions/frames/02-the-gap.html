  <script>
    (function () {
      window.__timelines = window.__timelines || {};

      var scope = document.querySelector('[data-composition-id="02-the-gap"]') || document;
      var q = function (sel) { return scope.querySelector(sel); };

      var tl = gsap.timeline({ paused: true });
      window.__timelines["02-the-gap"] = tl;

      /* guarded entrance helper — a missing node must never throw mid-build */
      var add = function (sel, from, to, time) {
        var el = (typeof sel === "string") ? q(sel) : sel;
        if (!el) { return; }
        tl.fromTo(el, from, to, time);
      };

      var TOTAL = 6.421;

      /* ── beat grid (seconds) ──────────────────────────────────────────
         Scene 1  0.00–1.80   axis self-draws · "AI code volume" sets
         Scene 2  1.80–3.80   volume line climbs · "Faster." lands
         Scene 3  3.80–5.40   capacity line draws flat · "Not safer." sets
         Scene 4  5.40–6.421  the wedge washes cobalt and holds
      */
      var AXIS_START = 0.04, AXIS_DUR = 0.86;
      var RULE_START = 0.16, RULE_DUR = 0.52;
      var LEGVOL_START = 1.12, LEG_DUR = 0.46;
      var GRID_START = 1.44, GRID_STAGGER = 0.09, GRID_DUR = 0.44;
      var VOL_START = 1.80, VOL_DUR = 1.25;
      var DOTV_START = 2.96, DOT_DUR = 0.30;
      var CAP_START = 3.85, CAP_DUR = 1.00;
      var DOTC_START = 4.88;
      var LEGCAP_START = 4.96;
      var BLOOM_START = 5.36, BLOOM_DUR = 0.72;
      var WASH_DUR = 0.80;
      var CALLOUT_START = 5.52, CALLOUT_DUR = 0.56;
      var IDLE_START = 5.42;

      var GLOW_PEAK_OPACITY = 0.26;   /* ≤ 0.45 ceiling */
      var GLOW_START_SCALE = 0.86;
      var WASH_PEAK_OPACITY = 0.13;   /* the faint primary wash inside the wedge */

      /* ── svg-path-draw · measured dash setup ───────────────────────── */
      var STROKES = [
        { el: q("#fr01-faster-not-safer-ax"),  fallback: 995 },
        { el: q("#fr01-faster-not-safer-g1"),  fallback: 995 },
        { el: q("#fr01-faster-not-safer-g2"),  fallback: 995 },
        { el: q("#fr01-faster-not-safer-g3"),  fallback: 995 },
        { el: q("#fr01-faster-not-safer-g4"),  fallback: 995 },
        { el: q("#fr01-faster-not-safer-vol"), fallback: 1240 },
        { el: q("#fr01-faster-not-safer-cap"), fallback: 995 }
      ];
      var LEN = {};
      STROKES.forEach(function (s) {
        if (!s.el) { return; }
        var len = s.fallback;
        if (typeof s.el.getTotalLength === "function") {
          var measured = s.el.getTotalLength();
          if (measured && measured > 1) { len = measured; }
        }
        len = len * 1.02; /* slight overestimate — never clips the tail */
        LEN[s.el.id] = len;
        s.el.style.strokeDasharray = String(len);
        s.el.style.strokeDashoffset = String(len);
      });
      var dashFrom = function (id) { return { strokeDashoffset: LEN[id] }; };

      /* ══ SCENE 1 (0.0–1.8s) — bare white field, the axis rules itself in ══ */
      add("#fr01-faster-not-safer-rule",
        { scaleX: 0, opacity: 0 },
        { scaleX: 1, opacity: 1, duration: RULE_DUR, ease: "power3.out" },
        RULE_START);

      add("#fr01-faster-not-safer-ax",
        dashFrom("fr01-faster-not-safer-ax"),
        { strokeDashoffset: 0, duration: AXIS_DUR, ease: "none" },
        AXIS_START);

      /* "AI code volume" sets — after the baseline settles (BRAND_FADE beat) */
      add("#fr01-faster-not-safer-legvol",
        { opacity: 0, y: 14 },
        { opacity: 1, y: 0, duration: LEG_DUR, ease: "power3.out" },
        LEGVOL_START);

      /* faint value rules arrive just before the climb needs something to read against */
      ["g1", "g2", "g3", "g4"].forEach(function (k, i) {
        add("#fr01-faster-not-safer-" + k,
          { opacity: 0, strokeDashoffset: LEN["fr01-faster-not-safer-" + k] },
          { opacity: 1, strokeDashoffset: 0, duration: GRID_DUR, ease: "none" },
          GRID_START + i * GRID_STAGGER);
      });

      /* ══ SCENE 2 (1.8–3.8s) — the volume line climbs, "Faster." lands ══ */
      add("#fr01-faster-not-safer-vol",
        dashFrom("fr01-faster-not-safer-vol"),
        { strokeDashoffset: 0, duration: VOL_DUR, ease: "power2.out" },
        VOL_START);

      add("#fr01-faster-not-safer-dotv",
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: DOT_DUR, ease: "back.out(2.2)" },
        DOTV_START);

      /* ── dynamic-content-sequencing · per-word reveal ────────────────
         Absolute start/end computed ONCE from word length + per-word config;
         nothing is recomputed per frame. */
      var WORD_BASE = 0.14, SEC_PER_CHAR = 0.030, WORD_REVEAL_DUR = 0.92;
      var HEAD_CONTENT = [
        { id: "fr01-faster-not-safer-w0", text: "Faster.", anchor: 2.08 },  /* Scene 2 */
        { id: "fr01-faster-not-safer-w1", text: "Not",     anchor: 3.96 },  /* Scene 3 */
        { id: "fr01-faster-not-safer-w2", text: "safer.",  anchor: null }
      ];
      var cursor = 0;
      var HEAD_TIMELINE = HEAD_CONTENT.map(function (entry) {
        var start = (entry.anchor === null) ? cursor : entry.anchor;
        var dur = WORD_BASE + entry.text.length * SEC_PER_CHAR;
        cursor = start + dur;
        return { id: entry.id, start: start, end: cursor };
      });

      HEAD_TIMELINE.forEach(function (entry) {
        add("#" + entry.id,
          { yPercent: 118, opacity: 0 },
          { yPercent: 0, opacity: 1, duration: WORD_REVEAL_DUR, ease: "power4.out" },
          entry.start);
      });

      /* ══ SCENE 3 (3.8–5.4s) — review capacity draws flat and level ══ */
      add("#fr01-faster-not-safer-cap",
        dashFrom("fr01-faster-not-safer-cap"),
        { strokeDashoffset: 0, duration: CAP_DUR, ease: "power2.out" },
        CAP_START);

      add("#fr01-faster-not-safer-dotc",
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: DOT_DUR, ease: "back.out(2.0)" },
        DOTC_START);

      add("#fr01-faster-not-safer-legcap",
        { opacity: 0, y: 14 },
        { opacity: 1, y: 0, duration: LEG_DUR, ease: "power3.out" },
        LEGCAP_START);

      /* ══ SCENE 4 (5.4–6.421s) — the wedge washes cobalt and holds ══ */
      /* ambient-glow-bloom, Form A / bloom-and-hold (scene < 3s → no breathe) */
      add("#fr01-faster-not-safer-glow",
        { opacity: 0, scale: GLOW_START_SCALE },
        { opacity: GLOW_PEAK_OPACITY, scale: 1, duration: BLOOM_DUR, ease: "power2.out" },
        BLOOM_START);

      add("#fr01-faster-not-safer-wedge",
        { opacity: 0 },
        { opacity: WASH_PEAK_OPACITY, duration: WASH_DUR, ease: "power2.out" },
        BLOOM_START);

      add("#fr01-faster-not-safer-callout",
        { opacity: 0, x: -22 },
        { opacity: 1, x: 0, duration: CALLOUT_DUR, ease: "power3.out" },
        CALLOUT_START);

      /* sine-wave-loop — low-amplitude jitter on the settled chart only.
         CYCLES = 0.5 so sin() returns to 0 exactly at the last frame: the
         frame hands off dead still. Frame stays locked — no camera move. */
      var chart = q("#fr01-faster-not-safer-chart");
      var IDLE_DUR = TOTAL - IDLE_START;
      var CYCLES = 0.5;
      var Y_AMP_PX = 2;
      var SCALE_AMP = 0.006;
      var phase = { p: 0 };
      tl.to(phase, {
        p: Math.PI * 2 * CYCLES,
        duration: IDLE_DUR,
        ease: "none",
        onUpdate: function () {
          if (!chart) { return; }
          var s = Math.sin(phase.p);
          chart.style.transform =
            "translateY(" + (s * Y_AMP_PX).toFixed(3) + "px) scale(" +
            (1 + s * SCALE_AMP).toFixed(5) + ")";
        }
      }, IDLE_START);

      tl.seek(0);
    })();
  </script>
