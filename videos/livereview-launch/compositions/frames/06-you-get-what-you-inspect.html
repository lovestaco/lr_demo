  <script>
    (function () {

      var DUR = 6.699;

      var tl = gsap.timeline({ paused: true });
      window.__timelines = window.__timelines || {};
      window.__timelines["06-you-get-what-you-inspect"] = tl;

      /* ==================================================================

        { y: 150, scale: 0.94, clipPath: "inset(100% 0% 0% 0%)" },

        { opacity: 1, duration: 0.5, ease: "power2.out" }, 0);

      /* context chrome sets the stage before the headline beat */

        { opacity: 1, y: 0, duration: 0.55, ease: "power2.out" }, 0.3);

      /* ==================================================================
         SCENE 2 (2.15-4.60s) — dynamic-content-sequencing.
         Per-word start times are REDUCED ONCE at build time from content
         length + per-word config; nothing is hand-offset. "inspect," carries
         an extra hold so the rhyme's first half lands on its own spoken beat
         and the second clause starts clean.
         ================================================================== */
      var QUOTE_START = 2.15;
      var BASE_STEP   = 0.125;   // minimum step per word
      var SEC_PER_CHAR = 0.024;  // longer words earn more of the rail
      var WORD_IN      = 0.44;   // entrance length per word

      var WORDS = [
        { key: "w1", text: "“You",      hold: 0 },
        { key: "w2", text: "get",            hold: 0 },
        { key: "w3", text: "what",           hold: 0 },
        { key: "w4", text: "you",            hold: 0 },
        { key: "w5", text: "inspect,",       hold: 0.24 },
        { key: "w6", text: "not",            hold: 0 },
        { key: "w7", text: "what",           hold: 0 },
        { key: "w8", text: "you",            hold: 0 },
        { key: "w9", text: "expect.”",  hold: 0 }
      ];

      var cumulative = 0;
      var RAIL = WORDS.map(function (w) {
        var step = BASE_STEP + w.text.length * SEC_PER_CHAR + w.hold;
        var start = QUOTE_START + cumulative;
        cumulative += step;
        return { key: w.key, start: start, end: start + WORD_IN };
      });

      RAIL.forEach(function (slot) {
        tl.fromTo(P + 'gw[data-w="' + slot.key + '"] ' + P + "wi",
          { opacity: 0, y: 18 },
          { opacity: 1, y: 0, duration: WORD_IN, ease: "power3.out" },

      /* ==================================================================
         SCENE 3 (4.60-6.699s) — the attribution sets small, then
         asr-keyword-glow touches "inspect" and then "expect" on the word
         rail. Default (subtle) style, committed: this is the stillest frame
         in the film. After the release the frame holds DEAD STILL — no
         push, no drift, no jitter, no breathing. The stillness is the payload.
         ================================================================== */
      tl.fromTo(P + "cite", { opacity: 0, y: 12 },
        { opacity: 1, y: 0, duration: 0.62, ease: "power3.out" }, 4.62);

      var ATTACK_DUR      = 0.16;
      var RELEASE         = 0.30;
      var REST_LEVEL      = 0.20;
      var MAX_BLUR        = 18;
      var MAX_SCALE_BOOST = 0.035;
      var MAX_GLOW_ALPHA  = 0.55;

      /* monotonic, non-overlapping spoken windows for the two beat words */
      var TIMINGS = {
        w5: { start: 4.62, end: 4.96 },
        w9: { start: 5.08, end: 5.46 }
      };

      var REST_RGB   = { r: 5,  g: 7,  b: 11 };   /* near-black headline */
      var ACTIVE_RGB = { r: 29, g: 86, b: 240 };  /* the single cobalt accent */

      function envelope(time, start, end) {
        if (time < start) return 0;
        if (time < end) return Math.min((time - start) / ATTACK_DUR, 1);
        var releaseEnd = end + RELEASE;
        if (time < releaseEnd) return 1 - ((time - end) / RELEASE) * (1 - REST_LEVEL);
        return REST_LEVEL;
      }
      function lerpChannel(a, b, t) { return Math.round(a + (b - a) * t); }
      function colorAt(env) {
        return "rgb(" + lerpChannel(REST_RGB.r, ACTIVE_RGB.r, env) + ", "
                      + lerpChannel(REST_RGB.g, ACTIVE_RGB.g, env) + ", "
                      + lerpChannel(REST_RGB.b, ACTIVE_RGB.b, env) + ")";
      }

      /* ONE linear driver sweeps scene time and computes every word's
         envelope — never one tween per word. Nodes are resolved lazily and
         cached so the query cannot run ahead of the cloned DOM. */
      var beatNodes = null;
      function nodes() {
        if (!beatNodes || !beatNodes.length) {
          beatNodes = document.querySelectorAll(".f-03-you-get-what-you-inspect-gw");
        }
        return beatNodes;
      }

      var driver = { t: 0 };
      tl.to(driver, {
        t: DUR,
        duration: DUR,
        ease: "none", /* linear — t maps 1:1 to scene time; any other ease warps the envelope */
        onUpdate: function () {
          var list = nodes();
          for (var i = 0; i < list.length; i++) {
            var el = list[i];
            var timing = TIMINGS[el.getAttribute("data-w")];
            if (!timing) continue;
            var env = envelope(driver.t, timing.start, timing.end);
            el.style.textShadow = "0 0 " + (MAX_BLUR * env).toFixed(2) + "px rgba(29, 86, 240, "

            el.style.transform = "scale(" + (1 + MAX_SCALE_BOOST * env).toFixed(4) + ")";
            el.style.color = colorAt(env);
