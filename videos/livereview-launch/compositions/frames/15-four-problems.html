  <script>
    (function () {
      var ID = "15-four-problems";
      var tl = gsap.timeline({ paused: true });
      function $(s) { return document.getElementById(ID + "-" + s); }

      /* Four sub-beats of 8.0 / 9.0 / 9.5 / 9.5s across 36.0s. The three
         longer beats buy back the reading time the 32.0s cut could not give
         questions 2-4. Every time below is a literal that matches the markup's
         data-start exactly — no arithmetic, so no drift.
           n      the beat index
           at     plate / group in       (beat boundaries 0 / 8 / 17 / 26.5)
           dur    plate window length; runs 0.5s past the next beat's start so
                  the incoming plate has something to fade up over
           title  numeral + title entrance   (at + 0.6)
           quest  question entrance          (at + 1.8; beat 3 is the one
                  exception, at + 1.5 — its 14-word question needs 7.28s of
                  hold under the reading floor and at + 1.8 gave only 7.09s)
           exit   group cross-dissolve out, on the next beat's boundary; null on
                  the last beat, which holds all the way to the cut. */
      var BEATS = [
        { n: 1, at: 0,    dur: 8.5,  title: 0.6,  quest: 1.8,  exit: 8 },
        { n: 2, at: 8,    dur: 9.5,  title: 8.6,  quest: 9.8,  exit: 17 },
        { n: 3, at: 17,   dur: 10.0, title: 17.6, quest: 18.5, exit: 26.5 },
        { n: 4, at: 26.5, dur: 9.5,  title: 27.1, quest: 28.3, exit: null }
      ];

      /* Fixtures + the tally row + the first mark ease in once, together, and
         hold. Beat 1 is already the live beat at frame open, so its mark comes
         up lit with the row rather than lighting later. */
      tl.fromTo([$("act"), $("slug-1"), $("tally"), $("mark-1")],
        { opacity: 0 }, { opacity: 1, duration: 0.7, ease: "power2.out" }, 0.2);

      for (var i = 0; i < BEATS.length; i++) {
        var b = BEATS[i];

        /* Ken Burns across this plate's own window: transform only, seek-safe. */
        tl.fromTo($("plate-" + b.n), { scale: 1.055 },
          { scale: 1.0, duration: b.dur, ease: "none" }, b.at);

        /* The dissolve. Plate 1 opens the frame already up; plates 2-4 fade in
           over the outgoing plate across the 0.5s window overlap. One opacity
           tween per plate, so a backwards seek can never fight itself. */
        if (b.n > 1) {
          tl.fromTo($("plate-" + b.n), { opacity: 0 },
            { opacity: 1, duration: 0.5, ease: "power2.out" }, b.at);

          /* This beat's slug and its tally mark arrive with the plate. */
          tl.fromTo([$("slug-" + b.n), $("mark-" + b.n)], { opacity: 0 },
            { opacity: 1, duration: 0.45, ease: "power2.out" }, b.at);
        }

        /* + 0.6 — numeral + title, one unit (the .22em tracking reads as a
           single tracked-out caption, so it does not enter per word). */
        tl.fromTo($("title-" + b.n),
          { opacity: 0, y: 18, filter: "blur(6px)" },
          { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.42, ease: "power3.out" }, b.title);

        /* + 1.8 — the question, the heavy key line, its two authored lines
           staggered. It holds for the rest of the beat. */
        tl.fromTo($("q-" + b.n).querySelectorAll("div"),
          { opacity: 0, y: 26, filter: "blur(8px)" },
          { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.52, ease: "power3.out", stagger: 0.09 }, b.quest);

        /* Beat end — title and question leave together on the group, riding out
           on the same 0.5s as the plate dissolve. The next beat's title does not
           enter until 0.6s later, so no two questions are ever on screen. */
        if (b.exit !== null) {
          tl.fromTo($("beat-" + b.n), { opacity: 1 },
            { opacity: 0, duration: 0.5, ease: "power2.in" }, b.exit);
        }
      }

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
