  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      /* =========================================================================
         SCENE 1 (0.0-1.6s) - the Improve node lifts out of the ring
         (card-morph-anchor) and the pillar question sets per-word.
         ========================================================================= */
      var NODE_SCALE = 2.5385;   /* 52px docked chip -> 132px ring node */
      var NODE_DX = -1114;       /* docked centre (1784,124) -> ring slot (670,820) */
      var NODE_DY = 696;
      var MORPH_START = 1.00;
      var MORPH_DUR = 0.60;

      tl.fromTo("#f12i-marker",
        { opacity: 0, x: NODE_DX, y: NODE_DY, scale: NODE_SCALE * 0.82, borderRadius: 26 },
        { opacity: 1, scale: NODE_SCALE, duration: 0.36, ease: "power3.out" }, 0.06);

      tl.fromTo("#f12i-eyebrow",
        { opacity: 0, y: 14 },
        { opacity: 1, y: 0, duration: 0.34, ease: "power2.out" }, 0.46);

      tl.fromTo("#f12i-q .f12i-word",
        { opacity: 0, y: 28 },
        { opacity: 1, y: 0, duration: 0.46, ease: "power3.out", stagger: 0.075 }, 0.62);

      /* one tween, all morph channels: uniform scale + paint-only props */
      tl.to("#f12i-marker",
        { x: 0, y: 0, scale: 1, borderRadius: 16,
          backgroundColor: "#1d56f0", borderColor: "#1d56f0",
          duration: MORPH_DUR, ease: "power2.inOut" }, MORPH_START);
      tl.to("#f12i-marker-old",
        { opacity: 0, duration: MORPH_DUR * 0.4, ease: "power1.in" }, MORPH_START);
      tl.to("#f12i-marker-new",
        { opacity: 1, duration: MORPH_DUR * 0.4, ease: "power1.out" },
        MORPH_START + MORPH_DUR * 0.6);

      /* =========================================================================
         SCENE 2 (1.6-3.4s) - "review history into answers": the Impact Report
         headline card settles in (long tail) and its real figures read out.
         ========================================================================= */
      tl.fromTo("#f12i-card",
        { opacity: 0, x: 56 },
        { opacity: 1, x: 0, duration: 0.46, ease: "power3.out" }, 1.62);

      tl.fromTo("#f12i-head > *",
        { opacity: 0 },
        { opacity: 1, duration: 0.30, ease: "power2.out", stagger: 0.035 }, 2.00);

      tl.fromTo("#f12i-fig1, #f12i-fig2, #f12i-fig3",
        { opacity: 0, y: 18 },
        { opacity: 1, y: 0, duration: 0.44, ease: "power3.out", stagger: 0.15 }, 2.40);

      /* hard cut: the stats instrument clears exactly as its clip window ends,
         handing the slot to the chart wall (one instrument per beat). */
      tl.set("#f12i-card", { opacity: 0 }, 3.40);

      /* =========================================================================
         SCENE 3 (3.4-5.6s) - "fifty-seven charts, one click": the numeral counts
         up with value-scaled growth (counting-dynamic-scale) while the chart wall
         expands center-outward on the SAME duration + ease (one chord), then the
         product's own confirmation lands on the wall.
         ========================================================================= */
      var COUNT_AT = 3.46, COUNT_DUR = 1.42, COUNT_EASE = "power3.out";
      var TARGET = 57;
      var START_SCALE = 0.55;          /* 82px start off the 150px static size */
      var START_PROGRESS = 0.30;

      var counter = document.getElementById("f12i-count");
      var state = { value: 0 };

      tl.fromTo("#f12i-count-wrap",
        { opacity: 0 }, { opacity: 1, duration: 0.26, ease: "power2.out" }, COUNT_AT);

      tl.to(state, {
        value: TARGET, duration: COUNT_DUR, ease: COUNT_EASE,
        onUpdate: function () { counter.textContent = Math.round(state.value); }
      }, COUNT_AT);

      tl.fromTo(counter,
        { scale: START_SCALE },
        { scale: 1, duration: COUNT_DUR, ease: COUNT_EASE }, COUNT_AT);

      /* center-outward-expansion, synced-to-driver variant: one shared proxy on the
         counter's exact duration + ease writes every tile's transform. */
      var tiles = document.querySelectorAll("#f12i-wall .f12i-tile");
      var TX = [], TY = [];
      for (var i = 0; i < tiles.length; i++) {
        TX.push(parseFloat(tiles[i].getAttribute("data-tx")));
        TY.push(parseFloat(tiles[i].getAttribute("data-ty")));
      }
      function placeTiles(p) {
        var s = 0.60 + 0.40 * p;
        for (var k = 0; k < tiles.length; k++) {
          tiles[k].style.transform =
            "translate(-50%, -50%) translate(" + (TX[k] * p) + "px, " + (TY[k] * p) + "px) scale(" + s + ")";
        }
      }
      placeTiles(START_PROGRESS);
      var burst = { p: START_PROGRESS };
      tl.to(burst, {
        p: 1, duration: COUNT_DUR, ease: COUNT_EASE,
        onUpdate: function () { placeTiles(burst.p); }
      }, COUNT_AT);

      tl.fromTo(tiles,
        { opacity: 0 }, { opacity: 1, duration: 0.46, ease: "power2.out" }, COUNT_AT);

      /* the label arrives before the count peaks - it is part of the headline */
      tl.fromTo("#f12i-countlabel",
        { opacity: 0, y: 18 },
        { opacity: 1, y: 0, duration: 0.50, ease: "power3.out" }, 4.10);

      /* the one-click artefact reads while the count is still running */
      tl.fromTo("#f12i-state-a",
        { opacity: 0, y: 26 },
        { opacity: 1, y: 0, duration: 0.50, ease: "power3.out" }, 4.52);

      /* the count resolves onto the product's own wording; the wall falls back
         into focus-falloff behind it (depth-of-field) */
      tl.fromTo("#f12i-banner",
        { opacity: 0, scale: 0.93 },
        { opacity: 1, scale: 1, duration: 0.58, ease: "power3.out" }, 5.00);
      tl.to(tiles,
        { opacity: 0.30, filter: "blur(3px)", duration: 0.52, ease: "power2.out" }, 5.00);
      tl.fromTo("#f12i-banner-cap",
        { opacity: 0, y: 14 },
        { opacity: 1, y: 0, duration: 0.44, ease: "power3.out" }, 5.34);

      /* =========================================================================
         SCENE 4 (5.6-7.765s) - "a chatbot you can just ask": the one-click report
         scale-swaps for Livi in the lower-left, then the frame holds.
         ========================================================================= */
      var TRIGGER = 5.78, EXIT_DUR = 0.38, OVERLAP = 0.16, EXIT_SCALE = 0.72;

      tl.to("#f12i-state-a",
        { scale: EXIT_SCALE, opacity: 0, duration: EXIT_DUR, ease: "power2.in" }, TRIGGER);

      tl.fromTo("#f12i-state-b",
        { scale: EXIT_SCALE, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.62, ease: "power3.out" },
        TRIGGER + EXIT_DUR - OVERLAP);

      tl.fromTo("#f12i-ask",
        { opacity: 0, y: 18 },
        { opacity: 1, y: 0, duration: 0.48, ease: "power3.out" }, 6.32);

      /* hold the landed state to the end of the frame */
      tl.to({}, { duration: 0.01 }, 7.755);

      window.__timelines["12-improve"] = tl;
      tl.seek(0);
    })();
  </script>
