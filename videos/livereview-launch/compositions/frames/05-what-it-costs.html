<template>
  <style>
    /* Brand face — staged locally at assets/fonts/Inter-var.woff2 (variable, wght 100-900).
       Declared so headless Chrome can actually supply Inter instead of falling back. */
    @font-face {
      font-family: "Inter";
      src: url("assets/fonts/Inter-var.woff2") format("woff2");
      font-weight: 100 900;
      font-style: normal;
      font-display: block;
    }

    #root {
      width: 1920px; height: 1080px; position: relative; overflow: hidden;
      font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      color: #05070b;
      -webkit-font-smoothing: antialiased;
    }

    /* ---------- ground ----------
       Full-bleed field lives on a clip layer, never on the frame root. */
    .n05-bg    { position: absolute; inset: 0; background: #ffffff; }
    .n05-layer { position: absolute; inset: 0; }

    /* ---------- the bare stage ----------
       Centred column, optically lifted off dead-centre (block centres at y≈455,
       i.e. 0.42x height) and clear of the 83% keep-out (block bottom ≈ 745px).
       Centring is flex, never a CSS transform — every child here is GSAP-
       transformed and a transform on the box would be silently overwritten. */
    .n05-stage {
      position: absolute; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 0 96px 170px;          /* pad-x 5cqw; bottom pad does the optical lift */
      box-sizing: border-box;
      text-align: center;
    }

    /* the three consequences — display ramp, pushed to hero scale.
       `negative` #dc2626 is rationed film-wide; consequence is this frame's
       entire subject, so it carries all three words. */
    .n05-word {
      font-size: 140px;
      font-weight: 700;
      line-height: 1.1;
      letter-spacing: -0.02em;
      color: #dc2626;
      white-space: nowrap;
      will-change: transform, filter;
    }

    /* the scale beneath them — body ramp, held above the legibility floor */
    .n05-scale {
      margin-top: 62px;
      font-size: 30px;
      font-weight: 400;
      line-height: 1.6;
      letter-spacing: 0.005em;
      color: #1648cf;
      white-space: nowrap;
    }
    .n05-fig { color: #1d56f0; font-weight: 600; font-variant-numeric: tabular-nums; }
    .n05-sep { color: #9A9A9A; }
  </style>

  <div id="root" data-composition-id="05-what-it-costs"
       data-start="0" data-duration="5.1" data-width="1920" data-height="1080">

    <div class="clip n05-bg" data-start="0" data-duration="5.1" data-track-index="0"></div>

    <div class="clip n05-layer" data-start="0" data-duration="5.1" data-track-index="1">
      <div class="n05-stage">
        <div class="n05-word" id="n05-w1">Outages.</div>
        <div class="n05-word" id="n05-w2">Breaches.</div>
        <div class="n05-word" id="n05-w3">Technical debt.</div>
        <div class="n05-scale" id="n05-scale"><span class="n05-fig">10</span> risk categories <span class="n05-sep">&middot;</span> <span class="n05-fig">100+</span> failure patterns <span class="n05-sep">&middot;</span> every commit</div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      /* =========================================================
         kinetic-beat-slam — ONE tempo grid drives every onset.
         PULSE 0.2s; the three consequence words sit on beats
         1 / 5 / 9 (0.8s apart), the scale line on beat 13 (2.6s),
         which is exactly where Scene 2 opens. No hand-tuned offsets.
         ========================================================= */
      var PULSE = 0.2;
      var BEATS = [PULSE * 1, PULSE * 5, PULSE * 9];   /* 0.2 / 1.0 / 1.8 */
      var SCALE_AT = PULSE * 13;                        /* 2.6 */
      var SCENE_DURATION = 4.5;

      /* ---------- SCENE 1 (0.0-2.6) — three words land in sequence ----------
         A DIFFERENT entrance axis per word (depth+blur slam, horizontal snap,
         vertical rise) and three distinct easings from the same no-overshoot
         family — the adapt note asks for a long smooth tail, never a bounce. */

      /* beat 1 — depth slam: oversized + defocused, resolving sharp at centre */
      tl.fromTo("#n05-w1",
        { scale: 1.32, filter: "blur(20px)", opacity: 0 },
        { scale: 1, filter: "blur(0px)", opacity: 1, duration: 0.45, ease: "power4.out" },
        BEATS[0]);

      /* beat 2 — side snap: hardest attack of the three */
      tl.fromTo("#n05-w2",
        { x: -280, opacity: 0 },
        { x: 0, opacity: 1, duration: 0.45, ease: "expo.out" },
        BEATS[1]);

      /* beat 3 — heavy rise with momentum; the word carries the most weight */
      tl.fromTo("#n05-w3",
        { y: 96, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.55, ease: "circ.out" },
        BEATS[2]);

      /* ---------- SCENE 2 (2.6-4.5) — the scale sets beneath them ----------
         Deliberately a quieter register than the slams: the consequences hit,
         the number underneath simply arrives and stays. */
      tl.fromTo("#n05-scale",
        { y: 22, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.55, ease: "power2.out" },
        SCALE_AT);

      /* Frame locks still for the tail — this is the last beat of the problem
         act, so it lands and stops. No breath, no drift; the no-op only holds
         the timeline's length equal to data-duration. */
      tl.set("#n05-scale", { opacity: 1 }, SCENE_DURATION);

      window.__timelines["05-what-it-costs"] = tl;
      tl.seek(0);
    })();
  </script>
</template>
