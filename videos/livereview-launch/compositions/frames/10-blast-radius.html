      var $ = function (s) { return document.getElementById(ID + "-" + s); };
      var words = $("head").querySelectorAll("span");
      var cells = $("quad").querySelectorAll("i");
      var tl = gsap.timeline({ paused: true });

      // ---- persistent chrome: the 3px cobalt strip, 36.0% -> 44.7% across the full 13s.
      tl.fromTo($("progress"), { width: "36%" }, { width: "44.7%", duration: 13, ease: "none" }, 0);

      // Scene 4 pieces start hidden (set at t=0 so a seek to any earlier frame is correct).
      tl.set([$("seal-a"), $("seal-arrow"), $("seal-b")], { opacity: 0 }, 0);
      tl.set([$("chip"), $("pin"), $("lead")], { opacity: 0 }, 0);
      tl.set($("ring"), { opacity: 0 }, 0);
      tl.set($("tick"), { strokeDasharray: 48, strokeDashoffset: 48 }, 0);

      // ================= Scene 1 (0.0-1.0s) — the answer line =================
      // Act chrome carried over from Frame 9: pill pops, quadrant cells tick in.
      tl.fromTo($("act"), { opacity: 0, scale: 0.6 },
        { opacity: 1, scale: 1, duration: 0.42, ease: "back.out(2.2)" }, 0.0);
      tl.fromTo(cells, { opacity: 0, scale: 0.5 },
        { opacity: 1, scale: 1, duration: 0.34, ease: "back.out(2)", stagger: 0.05 }, 0.06);
      // The answer line reveals per word (blur-lift stagger) — hero readable well before 0.5s.
      tl.fromTo(words, { opacity: 0, y: 24, filter: "blur(6px)" },
        { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.46, ease: "power3.out", stagger: 0.048 }, 0.12);

      // ================= Scene 2 (1.0-2.0s) — the window rises and LANDS =================
      // Long-tail expo settle finishing at 1.85s: fully at rest, opacity 1, no transform,
      // a clear beat before the clip's data-start at 2.0s. The window never moves again.
      tl.fromTo($("win"), { opacity: 0, y: 170 },
        { opacity: 1, y: 0, duration: 0.85, ease: "expo.out" }, 1.0);
      tl.fromTo($("skel").children, { opacity: 0, x: -22 },
        { opacity: 1, x: 0, duration: 0.3, ease: "power2.out", stagger: 0.042 }, 1.35);

      // ================= Scene 3 (2.0-10.0s) — the clip is the only motion =================
      // clip05_blast.mp4 plays whole in 232,379 1456x623 (contain). The frame holds still.
      // At 6.2s the risk chip springs in beside the window's lower-right edge, then holds.

        { opacity: 1, scale: 1, duration: 0.28, ease: "back.out(3)" }, 6.2);
      tl.fromTo($("lead"), { opacity: 1, scaleX: 0 },
        { opacity: 1, scaleX: 1, duration: 0.22, ease: "power2.out" }, 6.32);
      tl.fromTo($("chip"), { opacity: 0, scale: 0.4, x: -16 },
        { opacity: 1, scale: 1, x: 0, duration: 0.62, ease: "back.out(2.4)" }, 6.42);
      var counter = { v: 0 };
      tl.fromTo(counter, { v: 0 }, {
        v: 71, duration: 0.75, ease: "power2.out",
        onUpdate: function () { $("num").textContent = String(Math.round(counter.v)); }
      }, 6.5);
      tl.fromTo($("label"), { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: 0.32, ease: "power2.out" }, 6.8);
      // One-shot pin ping — a single fromTo, then stillness until Scene 4.
      tl.fromTo($("ring"), { opacity: 0.7, scale: 1 },
        { opacity: 0, scale: 3.4, duration: 1.05, ease: "power2.out" }, 7.0);

      // ================= Scene 4 (10.0-13.0s) — the act seal =================
      // Within-frame swap (not a frame exit): the window + chip hand their weight to the
      // seal that takes the space they vacate. The frame's landed state is the seal, held.

        { opacity: 0, duration: 0.55, ease: "power2.inOut" }, 10.0);
      tl.to($("win"), { scale: 0.965, duration: 0.6, ease: "power2.in" }, 10.0);

      // "The Attention Problem" reveals centred in the vacated area.

      tl.fromTo($("seal-arrow"), { opacity: 0, x: -14 },
        { opacity: 1, x: 0, duration: 0.35, ease: "power2.out" }, 11.15);

      tl.to($("tick"), { strokeDashoffset: 0, duration: 0.42, ease: "power2.out" }, 11.7);
