  <script>
    (function () {
      var ID = "01-generation-vs-inspection";
      var $ = function (s) { return document.getElementById(ID + "-" + s); };
      var tl = gsap.timeline({ paused: true });

      /* ---------- Scene 4 copy is built as per-character slots up front ---------- */
      var INSP = "AI-Assisted Code Inspection?";
      var inspEl = $("insp");
      var chars = [];
      for (var i = 0; i < INSP.length; i++) {
        var sp = document.createElement("span");
        sp.textContent = INSP.charAt(i);
        if (i === INSP.length - 1) { sp.id = ID + "-insp-q"; }
        inspEl.appendChild(sp);
        chars.push(sp);
      }
      var qMark = chars[chars.length - 1];
      var bodyChars = chars.slice(0, chars.length - 1);

      /* ---------- mark field geometry: outward drift vectors from frame centre ---------- */
      var MARKS = [
        { k: "m0", w: "w0", dx: -37, dy: -15, s: 1.00 },
        { k: "m1", w: "w1", dx: 32, dy: -12, s: 0.92 },
        { k: "m2", w: "w2", dx: -36, dy: 12, s: 0.96 },
        { k: "m3", w: "w3", dx: 35, dy: 8, s: 1.04 },
        { k: "m4", w: "w4", dx: 4, dy: 30, s: 0.88 }
      ];

      /* ---------- persistent chrome: 0.0% -> 5.3% across the full shot ---------- */
      tl.fromTo($("progress"), { width: "0%" }, { width: "5.3%", duration: 8, ease: "none" }, 0);

      /* ================= Scene 1 (0.0-2.2s) — white field, lead builds, marks drift ================= */
      // eyebrow pops first so the hero cluster is alive well before t=0.5s
      tl.fromTo($("eyebrow"), { opacity: 0, scale: 0.72 },
        { opacity: 1, scale: 1, duration: 0.42, ease: "power3.out" }, 0.0);

      // per-word staggered fade/blur reveal of the lead (kinetic-beat-slam, one shared cadence)
      tl.fromTo($("lead-a").querySelectorAll("span"),
        { opacity: 0, y: 26, filter: "blur(7px)" },
        { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "power3.out", stagger: 0.075 }, 0.16);

      // provider marks fade up to 22% at layered depth...
      MARKS.forEach(function (m, i) {
        tl.fromTo($(m.k), { opacity: 0, scale: m.s * 0.86 },
          { opacity: 0.22, scale: m.s, duration: 0.75, ease: "power2.out" }, 0.4 + i * 0.09);
        // ...then drift slowly outward and STOP as the payoff line arrives (2.4s)
        tl.fromTo($(m.k), { x: 0, y: 0 },
          { x: m.dx, y: m.dy, duration: 1.5, ease: "none" }, 0.9);
      });

      /* ================= Scene 2 (2.2-3.8s) — the payoff line scale-pops in cobalt ================= */
      tl.fromTo($("gen-in"), { opacity: 0, scale: 0.68 },
        { opacity: 1, scale: 1, duration: 0.6, ease: "power3.out" }, 2.2);

      /* ================= Scene 3 (3.8-5.4s) — hard beat: token swap + marks clear ================= */
      // the marks clear outward and vanish
      // (the clear rides the wrapper, so it never shares a property with the fade-up/drift above)
      MARKS.forEach(function (m, i) {
        tl.fromTo($(m.w), { x: 0, y: 0, opacity: 1 },
          { x: m.dx * 3.6, y: m.dy * 3.6, opacity: 0, duration: 0.7, ease: "power2.in" }, 3.8 + i * 0.05);
      });

      // discrete state director: the lead line and the centre line swap IN PLACE at a
      // threshold (discrete-text-sequence) — no fade-out/fade-in drift on the swap.
      // The hard-cut swap at 3.8s is owned by the framework's clip gating on
      // lead-a / lead-b / gen (data-start + data-duration above), so nothing
      // writes a persistent inline style that could outlive this frame's window.

      /* ================= Scene 4 (5.4-8.0s) — inspection types in, weight-first, then holds ======== */
      // the line's weight axis climbs as the characters land
      var wght = { w: 300 };
      tl.fromTo(wght, { w: 300 }, {
        w: 700, duration: 1.3, ease: "power2.out",
        onUpdate: function () { inspEl.style.fontVariationSettings = '"wght" ' + Math.round(wght.w); }
      }, 5.4);

      // character-by-character type-on
      tl.fromTo(bodyChars, { opacity: 0 },
        { opacity: 1, duration: 0.1, ease: "none", stagger: 0.042 }, 5.42);

      // the "?" lands last — a spring-pop punctuation snap, then the frame holds still
      tl.fromTo(qMark, { opacity: 0, scale: 0 },
        { opacity: 1, scale: 1, duration: 0.5, ease: "power3.out" }, 6.58);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
