<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>LiveReview — Six things AI-written code breaks</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      *{margin:0;padding:0;box-sizing:border-box}
      html,body{height:100%;background:#0b1020;color:#e8ecf5;
        font:14px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}
      #app{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:20px}
      #wrap{position:relative;border-radius:10px;overflow:hidden;box-shadow:0 18px 60px rgba(0,0,0,.55);background:#fff}
      #scaler{transform-origin:0 0}
      #root{position:relative;width:1920px;height:1080px;overflow:hidden;background:#fff}
      .scene{position:absolute;inset:0;width:100%;height:100%}
      #bar{display:flex;align-items:center;gap:14px;width:min(1100px,94vw)}
      button{background:rgba(255,255,255,.08);color:#e8ecf5;border:1px solid rgba(255,255,255,.14);
        border-radius:7px;padding:8px 16px;font:inherit;cursor:pointer;white-space:nowrap}
      button:hover{background:rgba(255,255,255,.16)}
      #track{position:relative;flex:1;height:26px;display:flex;align-items:center}
      #scrub{width:100%;appearance:none;height:4px;border-radius:2px;background:rgba(255,255,255,.16);outline:none}
      #scrub::-webkit-slider-thumb{appearance:none;width:13px;height:13px;border-radius:50%;background:#4d7dff;cursor:pointer}
      #chapters{position:absolute;inset:0;pointer-events:none}
      .chapter{position:absolute;top:4px;width:2px;height:8px;padding:0;border:0;border-radius:0;
        background:rgba(255,255,255,.3);pointer-events:auto;cursor:pointer}
      .chapter.act{height:16px;top:0;width:2px;background:#4d7dff}
      .chapter:hover{background:#fff}
      #clock{font-variant-numeric:tabular-nums;color:#9aa6c4;white-space:nowrap}
      #status{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
        background:#0b1020;color:#9aa6c4;font-size:14px;z-index:99}
      body.ready #status{display:none}
      #hint{color:#6f7c9d;font-size:12px}
    </style>
  </head>
  <body>
    <div id="status">loading…</div>
    <div id="app">
      <div id="wrap"><div id="scaler"><div id="root"></div></div></div>
      <div id="bar">
        <button id="play">Play</button>
        <div id="track"><input id="scrub" type="range" min="0" max="1000" value="0" step="1" /><div id="chapters"></div></div>
        <div id="clock">0:00 / 2:37</div>
      </div>
      <div id="hint">Space play/pause · ← → skip 5s · F full screen · click a tick to jump to a scene</div>
    </div>
    <script type="module" src="/src/player.js"></script>
  </body>
</html>
