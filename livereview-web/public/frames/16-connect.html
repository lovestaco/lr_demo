  <script>
    (function () {
      var DUR = 8.171;
      var tl = gsap.timeline({ paused: true });

      /* --- Scene 1 (0.0-1.8s): slide-header lands, the Connect node morphs into the pinned mark --- */
      tl.fromTo(".f13-eyebrow", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 0.12);
      tl.fromTo(".f13-head", { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: 0.65, ease: "power3.out" }, 0.3);

      /* card-morph-anchor: hold the node, then ONE tween carries scale + borderRadius + background + the lift. */
      tl.fromTo("#f13-anchor",
        { x: 176, y: 188, scale: 0.365, borderRadius: 274, backgroundColor: "rgb(29,86,240)" },
        { x: 0, y: 0, scale: 1, borderRadius: 14, backgroundColor: "rgba(29,86,240,0.04)", duration: 0.9, ease: "power2.inOut" },
        0.55);
      tl.to(".f13-node-label", { opacity: 0, duration: 0.36, ease: "power1.in" }, 0.55);
      tl.fromTo(".f13-lockup", { opacity: 0 }, { opacity: 1, duration: 0.36, ease: "power1.out" }, 1.09);
      /* From t=1.45s the mark is PINNED: no tween below ever touches #f13-anchor again. */

      /* --- Scene 2 (1.8-6.4s): discrete-text-sequence. One category per spoken item, hard cuts. --- */
      var ORDER = ["s1", "s5", "s2", "s3", "s4"];
      var BEAT = [2.05, 3.2, 4.3, 5.25, 6.05];
      var SETTLE = 6.8;
      var STEP = 0.06;

      var slots = [], lines = [], toks = [];
      for (var i = 0; i < ORDER.length; i++) {
        var el = document.getElementById("f13-" + ORDER[i]);
        slots.push(el);
        lines.push(document.getElementById("f13-l-" + ORDER[i]));
        toks.push(el ? Array.prototype.slice.call(el.querySelectorAll(".f13-tok")) : []);
      }

      function render(t) {
        var lit = 0, active = -1;
        for (var i = 0; i < BEAT.length; i++) {
          if (t >= BEAT[i]) { lit = i + 1; active = i; }
        }
        if (t >= SETTLE) active = -1; /* Scene 3: the satellites settle into a static ring */

        for (var s = 0; s < ORDER.length; s++) {
          var on = s < lit;
          var hot = (s === active);
          var el = slots[s];
          if (el) {
            el.style.visibility = on ? "visible" : "hidden";
            el.style.opacity = on ? (hot ? "1" : "0.9") : "0";
            el.style.borderColor = hot ? "rgba(29,86,240,0.55)" : "rgba(29,86,240,0.2)";
            el.style.backgroundColor = hot ? "rgba(29,86,240,0.09)" : "rgba(29,86,240,0.04)";
          }
          var ln = lines[s];
          if (ln) ln.style.opacity = on ? (hot ? "0.55" : "0.25") : "0";

          var list = toks[s];
          var shown = 0;
          if (on) {
            shown = Math.floor((t - BEAT[s]) / STEP) + 1;
            if (shown > list.length) shown = list.length;
          }
          for (var j = 0; j < list.length; j++) {
            list[j].style.opacity = j < shown ? "1" : "0";
          }
        }
      }

      var driver = { t: 0 };
      tl.fromTo(driver, { t: 0 },
        { t: DUR, duration: DUR, ease: "none", onUpdate: function () { render(driver.t); } }, 0);

      /* --- Scene 3 (6.4-8.171s): the Connect Git screen reads in its card; the anchor holds dead still. --- */
      tl.fromTo(".f13-vidcard", { opacity: 0 }, { opacity: 1, duration: 0.26, ease: "power2.out" }, 6.42);

      window.__timelines = window.__timelines || {};
      window.__timelines["16-connect"] = tl;
      tl.seek(0);
      render(0);
    })();
  </script>
