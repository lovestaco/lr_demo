<template>
  <style>
    /* Brand face — staged locally at assets/fonts/Inter-var.woff2 (variable, wght 100-900).
       Declared so headless Chrome can actually supply Inter instead of falling back. */
    @font-face {
      font-family: "Inter";
      src: url("assets/fonts/Inter-var.woff2") format("woff2");
      font-weight: 100 900;
      font-style: normal;
      font-display: block;
    }

    #root {
      width: 1920px; height: 1080px; position: relative; overflow: hidden;
      container-type: size;
      font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      color: #05070b;
      -webkit-font-smoothing: antialiased;
    }

    /* ── ground ───────────────────────────────────────────────────────── */
    .n01-bg { position: absolute; inset: 0; background: #ffffff; }
    .n01-stage { position: absolute; inset: 0; }

    /* ── carrier: the single cobalt rule that travels the three clauses ── */
    .n01-rule {
      position: absolute; left: 100px; top: 232px; width: 5px; height: 84px;
      background: #1d56f0; border-radius: 3px; transform-origin: 50% 0;
    }

    /* ── stacked clauses (display ramp, left-aligned, one per beat) ────── */
    .n01-clause {
      position: absolute; left: 160px; width: 1660px;
      font-size: 78px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.15;
      color: #05070b;
    }
    .n01-c1 { top: 225px; }
    .n01-c2 { top: 455px; }
    .n01-c3 { top: 685px; }

    .n01-word { display: inline-block; will-change: transform; }

    /* focal phrase of the focal clause — weight emphasis, cobalt underline */
    .n01-mark { position: relative; font-weight: 700; }
    .n01-underline {
      position: absolute; left: 2px; right: 4px; bottom: 10px; height: 5px;
      background: #1d56f0; border-radius: 3px;
      transform-origin: 0% 50%; opacity: 0;
    }
  </style>

  <div id="root" data-composition-id="01-the-shift" data-start="0" data-duration="5.5" data-width="1920" data-height="1080">
    <div class="clip n01-bg" data-start="0" data-duration="5.5" data-track-index="0"></div>
    <div class="clip n01-stage" data-start="0" data-duration="5.5" data-track-index="1">

      <!-- beat 1 -->
      <div class="n01-clause n01-c1"><span class="n01-word">AI</span> <span class="n01-word">writes</span> <span class="n01-word">more</span> <span class="n01-word">of</span> <span class="n01-word">your</span> <span class="n01-word">code</span> <span class="n01-word">every</span> <span class="n01-word">week.</span></div>

      <!-- beat 2 -->
      <div class="n01-clause n01-c2"><span class="n01-word">Your</span> <span class="n01-word">review</span> <span class="n01-word">capacity</span> <span class="n01-word">hasn&rsquo;t</span> <span class="n01-word">changed.</span></div>

      <!-- beat 3 — the focal clause -->
      <div class="n01-clause n01-c3"><span class="n01-word">So</span> <span class="n01-word">what</span> <span class="n01-word">does</span> <span class="n01-word">that</span> <span class="n01-word">actually</span> <span class="n01-word n01-mark">cost you?<i class="n01-underline"></i></span></div>

      <!-- the carrier rule -->
      <div class="n01-rule"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });
      window.__timelines["01-the-shift"] = tl;

      var root = document.querySelector('[data-composition-id="01-the-shift"]');
      if (!root) { tl.seek(0); return; }
      var q  = function (s) { return root.querySelector(s); };
      var qa = function (s) { return Array.prototype.slice.call(root.querySelectorAll(s)); };

      var c1 = q('.n01-c1'), c2 = q('.n01-c2');
      var rule = q('.n01-rule'), underline = q('.n01-underline');
      var w1 = qa('.n01-c1 .n01-word');
      var w2 = qa('.n01-c2 .n01-word');
      var w3 = qa('.n01-c3 .n01-word');

      var INK = "#05070b", GREY = "#9A9A9A";

      /* --- waterfall entry: per-word x-cascade with geometrically shrinking gaps --- */
      function waterfall(words, at, cfg) {
        var gap = cfg.gap, off = 0;
        for (var i = 0; i < words.length; i++) {
          tl.fromTo(words[i],
            { x: cfg.x, opacity: 0, filter: "blur(" + cfg.blur + "px)" },
            { x: 0, opacity: 1, filter: "blur(0px)", duration: cfg.dur, ease: "power4.out" },
            at + off);
          off += gap; gap *= cfg.decay;
        }
      }

      /* ========= Scene 1 (0.0–1.8) — bare field, clause one builds word by word ===== */
      /* long gaps + long tail: the opening statement is given reading speed */
      waterfall(w1, 0.06, { x: 150, blur: 12, dur: 0.62, gap: 0.062, decay: 0.88 });
      tl.fromTo(rule,
        { scaleY: 0, opacity: 0 },
        { scaleY: 1, opacity: 1, duration: 0.42, ease: "power3.out" },
        0.30);

      /* ========= Scene 2 (1.8–3.4) — one greys, the rule drops, two arrives ======== */
      tl.to(rule, { y: 230, duration: 0.46, ease: "power3.inOut" }, 1.82);
      tl.fromTo(c1, { color: INK }, { color: GREY, duration: 0.50, ease: "power2.out" }, 1.84);
      waterfall(w2, 1.92, { x: 240, blur: 9, dur: 0.34, gap: 0.052, decay: 0.84 });

      /* ========= Scene 3 (3.4–5.5) — two greys, the question lands and holds ======= */
      tl.to(rule, { y: 460, duration: 0.46, ease: "power3.inOut" }, 3.42);
      tl.fromTo(c2, { color: INK }, { color: GREY, duration: 0.50, ease: "power2.out" }, 3.44);
      waterfall(w3, 3.55, { x: 240, blur: 9, dur: 0.34, gap: 0.052, decay: 0.84 });

      /* the single accent marks the words the next four frames answer */
      tl.fromTo(underline,
        { scaleX: 0, opacity: 0 },
        { scaleX: 1, opacity: 1, duration: 0.48, ease: "power3.out" },
        4.38);
      /* holds dead still from ~4.86s into the cut */

      tl.seek(0);
    })();
  </script>
</template>
