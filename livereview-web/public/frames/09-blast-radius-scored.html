  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      /* =====================================================================
         Scene 1 (0.0-2.2) — "LiveReview scores every hunk"
         Headline sets left per word; the surface card mounts right on a
         long-tail settle and the screen turns on as the recording starts.
         ===================================================================== */
      tl.fromTo("#f06-eyebrow",
        { opacity: 0, y: 14 },
        { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.08);

      /* dynamic-content-sequencing — each word's start is pre-computed ONCE
         from its content length + a per-item floor. Never inside an onUpdate. */
      var WORD_BASE = 0.10;      /* BASE_DURATION floor per word */
      var SEC_PER_CHAR = 0.018;  /* longer words earn more runway */
      var cursor = 0.28;
      gsap.utils.toArray(".f06-word").forEach(function (word) {
        tl.fromTo(word,
          { opacity: 0, y: 26 },
          { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" }, cursor);
        cursor += WORD_BASE + word.textContent.length * SEC_PER_CHAR;
      });

      /* the surface mounts from the right and settles at 0.97 — the hoisted
         recording starts at 1.00, so the card is dead still under it. */
      tl.fromTo("#f06-card",
        { x: 64, opacity: 0, scale: 0.985 },
        { x: 0, opacity: 1, scale: 1, duration: 0.75, ease: "power3.out" }, 0.22);

      tl.fromTo("#f06-dot-1, #f06-dot-2, #f06-dot-3",
        { opacity: 0 },
        { opacity: 1, duration: 0.3, ease: "power2.out", stagger: 0.05 }, 0.80);
      tl.fromTo("#f06-path-a",
        { opacity: 0, x: -10 },
        { opacity: 1, x: 0, duration: 0.4, ease: "power2.out" }, 0.88);

      /* =====================================================================
         Scene 2 (2.2-5.0) — "by its blast radius"
         The numeric score sets on the left while the surface advances from the
         live recording to the call-graph view, framed by coordinate-target-zoom.
         ===================================================================== */
      tl.fromTo("#f06-label",
        { opacity: 0, y: 16 },
        { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 2.20);

      tl.fromTo("#f06-numrow",
        { opacity: 0, y: 26 },
        { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 2.32);

      var numEl = document.getElementById("f06-num");
      var counter = { value: 0 };
      tl.to(counter, {
        value: 51, duration: 0.9, ease: "power2.out",
        onUpdate: function () { numEl.textContent = Math.round(counter.value); }
      }, 2.36);

      tl.fromTo("#f06-track",
        { opacity: 0 },
        { opacity: 1, duration: 0.3, ease: "power2.out" }, 2.62);
      tl.fromTo("#f06-fill",
        { scaleX: 0 },
        { scaleX: 1, duration: 0.9, ease: "power2.out" }, 2.70);

      tl.fromTo("#f06-stat-a, #f06-statlbl-a",
        { opacity: 0, y: 18 },
        { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 2.95);
      tl.fromTo("#f06-stat-b, #f06-statlbl-b",
        { opacity: 0, y: 18 },
        { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 3.12);

      /* --- the surface advance: recording (ends 2.78) -> call-graph view.
         The still is brought up underneath while the video still covers the
         window, so the swap lands as a screen state change, not a fade. --- */
      tl.fromTo("#f06-still",
        { opacity: 0 },
        { opacity: 1, duration: 0.25, ease: "none" }, 2.50);
      tl.to("#f06-path-a",
        { opacity: 0, duration: 0.18, ease: "power1.out" }, 2.74);
      tl.fromTo("#f06-path-b",
        { opacity: 0 },
        { opacity: 1, duration: 0.22, ease: "power1.out" }, 2.80);

      /* --- coordinate-target-zoom -------------------------------------------
         Nested wrappers: OUTER scales, INNER counter-translates. The counter-
         translate is the NEGATION of the target's offset from the window centre
         (T = -offset) and is INDEPENDENT of the scale, so it is baked once and
         held constant through the push. Offsets are derived from the authored
         pixel geometry of the still inside its window (fixed boxes, no font
         metrics involved), then shared by scale + translate at one position,
         one duration, one ease. --------------------------------------------- */
      var BOX_W = 906, BOX_H = 343;          /* media window */
      var IMG_R = 906 / 919;                 /* rendered px per source px */
      var IMG_TOP = -56.2;                   /* img offset inside the window */

      function srcOffset(sx, sy) {           /* source px -> offset from centre */
        return { x: sx * IMG_R - BOX_W / 2, y: sy * IMG_R + IMG_TOP - BOX_H / 2 };
      }

      /* target = the scoring-factor cluster (the point breakdown) */
      var FACTOR = srcOffset(380, 155);
      var FACTOR_T = { x: -FACTOR.x, y: -FACTOR.y };
      var S_ARRIVE = 1.24;   /* the state the surface advances into */
      var S_PEAK = 1.46;     /* headroom-capped: the cluster stays < 90% of the window */
      var ZOOM_AT = 3.20, ZOOM_DUR = 1.2, ZOOM_EASE = "power3.inOut";

      gsap.set("#f06-zoom-outer", { scale: S_ARRIVE });
      gsap.set("#f06-shot", { x: FACTOR_T.x, y: FACTOR_T.y });

      tl.to("#f06-zoom-outer",
        { scale: S_PEAK, duration: ZOOM_DUR, ease: ZOOM_EASE }, ZOOM_AT);
      tl.to("#f06-shot",
        { x: FACTOR_T.x, y: FACTOR_T.y, duration: ZOOM_DUR, ease: ZOOM_EASE }, ZOOM_AT);

      /* =====================================================================
         Scene 3 (5.0-7.6) — "how far a change can reach"
         Zoom-out variation of the same rule: the reveal beat is the panorama,
         and the rings open outward from the centre of the call graph. The
         depth-of-field pull runs on the SAME window, so "the world recedes"
         and "we pull back onto the chart" read as one move.
         ===================================================================== */
      var OUT_AT = 5.05, OUT_DUR = 1.65, OUT_EASE = "power3.inOut";
      tl.to("#f06-zoom-outer",
        { scale: 1, duration: OUT_DUR, ease: OUT_EASE }, OUT_AT);
      tl.to("#f06-shot",
        { x: 0, y: 0, duration: OUT_DUR, ease: OUT_EASE }, OUT_AT);

      /* depth-of-field-blur — focal pull. Blur scales with data-depth; the
         surface card (the focal layer) is never touched and sits above. */
      var BLUR_PER_DEPTH = 4;   /* px per depth step */
      var DIM_LEVEL = 0.55;
      var FOCUS_AT = 5.15, FOCUS_DUR = 0.9;
      gsap.utils.toArray(".f06-layer").forEach(function (el) {
        var depth = Number(el.dataset.depth) || 1;
        tl.to(el, {
          "--dof": (BLUR_PER_DEPTH * depth) + "px",
          opacity: DIM_LEVEL,
          duration: FOCUS_DUR,
          ease: "power2.inOut"
        }, FOCUS_AT);
      });

      /* =====================================================================
         Scene 4 (7.6-9.067) — "traced through a live call graph"
         The supporting line sets beneath the card; the surface holds, with a
         single settling breath that resolves (no idle loop).
         ===================================================================== */
      tl.fromTo(".f06-pill",
        { opacity: 0, y: 18 },
        { opacity: 1, y: 0, duration: 0.5, ease: "power3.out", stagger: 0.13 }, 7.62);

      tl.to("#f06-zoom-outer",
        { scale: 1.012, duration: 1.15, ease: "power1.inOut" }, 7.80);

      window.__timelines["09-blast-radius-scored"] = tl;
      tl.seek(0);
    })();
