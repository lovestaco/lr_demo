  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      window.__timelines = window.__timelines || {};

      var ID = "07-inspection-layer";
      var root = document.querySelector('[data-composition-id="' + ID + '"]') || document;
      var q = function (s) { return root.querySelector(s); };
      var qa = function (s) { return Array.prototype.slice.call(root.querySelectorAll(s)); };

      var DUR = 8.981;

      /* ---- shared geometry: ONE source for the rule, the cards and the connectors ---- */
      var CX = 960;            /* the hub's rendered centre x */
      var RULE_Y = 384;        /* the layer line */
      var CONN_Y0 = 464;       /* connectors start just above the card tops (470) */
      var FAN = 0.5;           /* connectors converge toward the hub as they rise */
      var ROW_LEFT = 200, PITCH = 312, CARD_W = 272;

      var tl = gsap.timeline({ paused: true });
      window.__timelines[ID] = tl;

      var camera = q("#fr-04-inspection-layer-camera");
      var hub = q("#fr-04-inspection-layer-hub");
      var eyebrow = q("#fr-04-inspection-layer-eyebrow");
      var above = q("#fr-04-inspection-layer-above");
      var tier = q("#fr-04-inspection-layer-tier");
      var cards = qa(".fr-04-inspection-layer-card");
      var net = q(".fr-04-inspection-layer-net");

      /* ---- setup: svg-path-draw — measure, then park each rule half fully undrawn ---- */
      qa(".fr-04-inspection-layer-rule").forEach(function (p) {
        var len = p.getTotalLength() || Number(p.getAttribute("data-len"));
        p.style.strokeDasharray = String(len);
        p.style.strokeDashoffset = String(len);
      });

      /* ---- setup: avatar-cloud-network — connectors built once from the shared centre,
             here inverted: each provider routes UP into the layer rule (solid-line variation) ---- */
      var conns = [];
      for (var i = 0; i < cards.length; i++) {
        var cx = ROW_LEFT + i * PITCH + CARD_W / 2;
        var ex = CX + (cx - CX) * FAN;
        var line = document.createElementNS("http://www.w3.org/2000/svg", "line");
        line.setAttribute("x1", String(cx));
        line.setAttribute("y1", String(CONN_Y0));
        line.setAttribute("x2", String(ex));
        line.setAttribute("y2", String(RULE_Y));
        line.setAttribute("stroke", "#1d56f0");
        line.setAttribute("stroke-width", "2");
        line.setAttribute("stroke-linecap", "round");
        line.setAttribute("opacity", "0.45");
        var len = Math.hypot(ex - cx, RULE_Y - CONN_Y0);
        line.style.strokeDasharray = String(len);
        line.style.strokeDashoffset = String(len);
        net.appendChild(line);
        conns.push(line);
      }

      /* ================= SCENE 1 (0.0-2.4s) — "LiveReview is that inspection layer"
         spring-pop-entrance: the mark arrives centred in the content area (y +200),
         smooth long-tail settle, no overshoot. Nothing else on screen. ================= */
      tl.fromTo(hub,
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.8, ease: "power3.out" }, 0.05);
      tl.fromTo(eyebrow,
        { opacity: 0, y: 14 },
        { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" }, 0.95);

      /* ================= SCENE 2 (2.4-4.4s) — "Independent — and sitting above…"
         the mark RISES to the upper third, then the layer rule draws outward beneath it
         (svg-path-draw, both halves from the hub's centre point). ================= */
      tl.fromTo(hub,
        { y: 200 },
        { y: 0, duration: 0.95, ease: "power2.inOut" }, 2.40);
      tl.fromTo(above,
        { opacity: 0, y: 10 },
        { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 3.05);
      tl.to("#fr-04-inspection-layer-rule-l",
        { strokeDashoffset: 0, duration: 0.7, ease: "power2.out" }, 3.30);
      tl.to("#fr-04-inspection-layer-rule-r",
        { strokeDashoffset: 0, duration: 0.7, ease: "power2.out" }, 3.34);

      /* ================= SCENE 3 (4.4-7.4s) — "Claude. Copilot. Cursor. Anything."
         orbit-3d-entry, ENTRY ONLY (no continuing orbit): each provider flips in from 3D
         IN PLACE at its own ring position below the rule, one per spoken name. ================= */
      var CARD_AT = [4.55, 5.15, 5.75, 6.45, 6.58];
      cards.forEach(function (el, idx) {
        tl.fromTo(el,
          { transformPerspective: 1200, rotateX: -70, rotateY: -45, z: -300, scale: 0.6, opacity: 0 },
          { transformPerspective: 1200, rotateX: 0, rotateY: 0, z: 0, scale: 1, opacity: 1,
            duration: 0.62, ease: "power3.out" },
          CARD_AT[idx]);
      });
      tl.fromTo(tier,
        { opacity: 0, y: 12 },
        { opacity: 1, y: 0, duration: 0.55, ease: "power2.out" }, 7.12);

      /* ================= SCENE 4 (7.4-8.981s) — the connectors draw upward from every
         provider into the layer rule, as a symmetric wave out from centre. Hold. ========= */
      conns.forEach(function (line, idx) {
        tl.to(line,
          { strokeDashoffset: 0, duration: 0.6, ease: "power2.out" },
          7.42 + Math.abs(idx - 2) * 0.06);
      });

      /* ================= multi-phase-camera — pullback → focus settle → one slow push
         that lands and STOPS before the frame ends. One writer of camera.style.transform. */
      var phase = { scale: 0.94 };
      tl.to(phase, { scale: 1.0, duration: 1.5, ease: "power3.out" }, 2.40);
      tl.to(phase, { scale: 1.055, duration: 1.5, ease: "power2.inOut" }, 7.30);

      var drift = { p: 0 };
      camera.style.transform = "scale(0.94) translate(0px, 0px)";
      tl.to(drift, {
        p: Math.PI * 2,
        duration: DUR,
        ease: "none",
        onUpdate: function () {
          var dx = Math.sin(drift.p) * 5;
          var dy = Math.sin(drift.p * 1.3) * 3;
          camera.style.transform = "scale(" + phase.scale + ") translate(" + dx + "px, " + dy + "px)";
        }
      }, 0);

      tl.seek(0);
    })();
  </script>
